<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linha da CDA · propostas</title>
<style>body{font:14px system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1f2733}header{padding:16px 20px;background:#fff;border-bottom:1px solid #e3e6ea}h1{font-size:18px;margin:0 0 4px}p{margin:0;color:#5a6b7d}nav{display:flex;gap:8px;padding:10px 20px;flex-wrap:wrap}nav button{border:1px solid #cfd5dc;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}nav button.on{background:#1f2733;color:#fff;border-color:#1f2733}iframe{width:100%;height:calc(100vh - 120px);border:0;background:#fff}</style></head><body>
<header><h1>Linha / card da CDA na Mesa de prazos — três propostas</h1><p>A · econômica (custo baixo) · B · avançada (custo alto) · C · «Decidir na linha» (custo médio). Todas: Lista, Tabela e gaveta da CDA abrindo sobre a Mesa com «Abrir operação ↗».</p></header>
<nav><button data-f="proposta-a.html" class="on">A · Econômica</button><button data-f="proposta-b.html">B · Avançada</button><button data-f="proposta-c.html">C · Decidir na linha (Opus)</button><button data-f="atual-lista.png">Atual · Lista</button><button data-f="atual-tabela.png">Atual · Tabela</button><button data-f="atual-gaveta-cda.png">Atual · Gaveta</button></nav>
<iframe id="f" src="proposta-a.html"></iframe>
<script>document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('f').src=b.dataset.f;});</script></body></html>
