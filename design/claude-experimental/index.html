<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS Claude Experimental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* NEXUS · Claude-experimental — protótipo de layout (dados fictícios).
   Três direções visuais: Ardósia (claro), Grafite (escuro) e Maré (herança do Mar Profundo).
   Sem data-dir o app segue o tema do sistema. */
:root, .nx[data-dir="ardosia"] {
  color-scheme: light;
  --ground: #f2f3f5; --panel: #ebedf0; --surface: #ffffff; --surface-2: #f6f7f9; --hover: #e7e9ed;
  --line: #dcdfe4; --line-strong: #c7cbd2;
  --ink: #14161a; --ink-2: #4d535e; --ink-3: #828894;
  --accent: #8a6722; --accent-soft: #f4ecdb; --accent-btn: #1b1e24; --accent-ink: #ffffff;
  --red: #c2323d; --red-soft: #fbe8e9; --orange: #bf5f16; --orange-soft: #fcefe3;
  --yellow: #946b00; --yellow-soft: #f8efd2; --blue: #2d62d3; --blue-soft: #e7eefc;
  --green: #21845a; --green-soft: #e2f3eb; --violet: #6a4fd4; --violet-soft: #eeeafc;
  --cyan: #0f7888; --cyan-soft: #e0f3f5;
  --op1: #2d62d3; --op2: #bf5f16; --op3: #21845a; --op4: #6a4fd4; --op5: #0f7888;
  --shadow: 0 1px 2px rgba(20,24,32,.05), 0 6px 20px rgba(20,24,32,.07);
  --shadow-lg: 0 24px 64px rgba(20,24,32,.22);
  --scrim: rgba(18,20,26,.34); --grid: rgba(20,24,32,.05); --hatch: rgba(20,24,32,.08);
  --font: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 6px; --r-lg: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #101113; --panel: #131417; --surface: #18191d; --surface-2: #1c1d22; --hover: #222429;
    --line: #26282e; --line-strong: #34373e;
    --ink: #e8e9ec; --ink-2: #a1a5ad; --ink-3: #6c717a;
    --accent: #d4ad60; --accent-soft: rgba(212,173,96,.13); --accent-btn: #d4ad60; --accent-ink: #17120a;
    --red: #f0646f; --red-soft: rgba(240,100,111,.13); --orange: #f09a4c; --orange-soft: rgba(240,154,76,.13);
    --yellow: #e8c95a; --yellow-soft: rgba(232,201,90,.12); --blue: #7aa8ff; --blue-soft: rgba(122,168,255,.13);
    --green: #5cc493; --green-soft: rgba(92,196,147,.13); --violet: #a894ff; --violet-soft: rgba(168,148,255,.14);
    --cyan: #5ccad8; --cyan-soft: rgba(92,202,216,.12);
    --op1: #7aa8ff; --op2: #f09a4c; --op3: #5cc493; --op4: #a894ff; --op5: #5ccad8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 24px 80px rgba(0,0,0,.6);
    --scrim: rgba(4,5,7,.58); --grid: rgba(255,255,255,.035); --hatch: rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"], .nx[data-dir="grafite"] {
  color-scheme: dark;
  --ground: #101113; --panel: #131417; --surface: #18191d; --surface-2: #1c1d22; --hover: #222429;
  --line: #26282e; --line-strong: #34373e;
  --ink: #e8e9ec; --ink-2: #a1a5ad; --ink-3: #6c717a;
  --accent: #d4ad60; --accent-soft: rgba(212,173,96,.13); --accent-btn: #d4ad60; --accent-ink: #17120a;
  --red: #f0646f; --red-soft: rgba(240,100,111,.13); --orange: #f09a4c; --orange-soft: rgba(240,154,76,.13);
  --yellow: #e8c95a; --yellow-soft: rgba(232,201,90,.12); --blue: #7aa8ff; --blue-soft: rgba(122,168,255,.13);
  --green: #5cc493; --green-soft: rgba(92,196,147,.13); --violet: #a894ff; --violet-soft: rgba(168,148,255,.14);
  --cyan: #5ccad8; --cyan-soft: rgba(92,202,216,.12);
  --op1: #7aa8ff; --op2: #f09a4c; --op3: #5cc493; --op4: #a894ff; --op5: #5ccad8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 80px rgba(0,0,0,.6);
  --scrim: rgba(4,5,7,.58); --grid: rgba(255,255,255,.035); --hatch: rgba(255,255,255,.07);
}
.nx[data-dir="mare"] {
  color-scheme: dark;
  --ground: #0e1828; --panel: #111c2f; --surface: #152238; --surface-2: #192840; --hover: #1e2f4a;
  --line: #233657; --line-strong: #2f4670;
  --ink: #e6ecf5; --ink-2: #9fb0c8; --ink-3: #687d99;
  --accent: #caa55c; --accent-soft: rgba(202,165,92,.14); --accent-btn: #caa55c; --accent-ink: #16110a;
  --red: #ef7282; --red-soft: rgba(239,114,130,.14); --orange: #f0a35e; --orange-soft: rgba(240,163,94,.14);
  --yellow: #e4c562; --yellow-soft: rgba(228,197,98,.13); --blue: #86b6ee; --blue-soft: rgba(134,182,238,.14);
  --green: #6fc89c; --green-soft: rgba(111,200,156,.14); --violet: #ad9cff; --violet-soft: rgba(173,156,255,.15);
  --cyan: #6fd2de; --cyan-soft: rgba(111,210,222,.13);
  --op1: #86b6ee; --op2: #f0a35e; --op3: #6fc89c; --op4: #ad9cff; --op5: #6fd2de;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(3,8,20,.4);
  --shadow-lg: 0 24px 80px rgba(2,6,16,.65);
  --scrim: rgba(4,9,20,.6); --grid: rgba(160,190,230,.045); --hatch: rgba(160,190,230,.09);
}

/* ─── Base ─── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.muted { color: var(--ink-3); }
.boot { display: grid; place-items: center; height: 100%; color: var(--ink-3); font: 12px var(--mono); }

/* ─── Shell ─── */
.nx { height: 100%; display: grid; grid-template-columns: 244px minmax(0, 1fr); background: var(--ground); color: var(--ink); }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-head { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 8px 0 12px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; padding: 4px 6px; margin-left: -6px; border: 0; border-radius: 6px; background: none; text-align: left; }
.brand:hover { background: var(--hover); }
.brand-mark { position: relative; width: 24px; height: 24px; border-radius: 6px; background: var(--ink); color: var(--ground); display: grid; place-items: center; font: 600 12px/1 var(--mono); flex: none; }
.brand-mark::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); }
.brand-name { font-weight: 600; letter-spacing: .04em; font-size: 12.5px; }
.brand-sub { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--ink-3); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.side-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 14px; min-height: 0; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); text-align: left; white-space: nowrap; }
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item.on { background: var(--hover); color: var(--ink); font-weight: 500; }
.nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-count { font: 500 11px var(--mono); color: var(--ink-3); }
.nav-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font: 600 10.5px/18px var(--mono); text-align: center; }
.nav-badge.red { background: var(--red-soft); color: var(--red); }
.nav-sec { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 500; color: var(--ink-3); padding: 18px 4px 6px 8px; }
.op-sq { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.nav-op .chev { width: 16px; height: 16px; display: grid; place-items: center; color: var(--ink-3); margin-left: -4px; transition: transform .15s; }
.nav-op.open .chev { transform: rotate(90deg); }
.nav-op .fav { color: var(--accent); }
.nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 1px 0 4px; }
.nav-sub .nav-item { padding-left: 32px; height: 28px; font-size: 12.5px; }
.side-foot { flex: none; border-top: 1px solid var(--line); padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.side-foot-l { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-3); padding: 0 2px; }
.dir-sw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.dir-opt { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 3px 4px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 10.5px; color: var(--ink-2); }
.dir-opt:hover { border-color: var(--line-strong); }
.dir-opt.on { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
.swatch { width: 100%; height: 16px; border-radius: 4px; display: flex; overflow: hidden; border: 1px solid rgba(128,128,128,.25); }
.swatch i { flex: 1; }
.side-scrim { display: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--ground); }
.menu-btn { display: none; }
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-3); white-space: nowrap; }
.crumb .sep { opacity: .6; }
.crumb b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: 30px; width: 250px; padding: 0 6px 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink-3); text-align: left; }
.search:hover { border-color: var(--line-strong); color: var(--ink-2); }
.search .t { flex: 1; }
kbd { font: 500 10.5px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-3); background: var(--surface-2); }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); white-space: nowrap; padding: 0 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent-btn); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-btn); filter: brightness(1.1); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn kbd { margin-left: 2px; }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .55; }
.content { flex: 1; overflow-y: auto; min-height: 0; }
.page { max-width: 1200px; margin: 0 auto; padding: 28px 32px 72px; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.page-h p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.page-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* ─── Common bits ─── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 7px 10px 7px 14px; }
.card-h h2 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
.card-h .aside { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.link-btn { border: 0; background: none; color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 5px; white-space: nowrap; }
.link-btn:hover { color: var(--ink); background: var(--hover); }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); gap: 1px; flex: none; }
.seg button { height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: none; color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.08); }
.seg .n { font: 500 10.5px var(--mono); color: var(--ink-3); }
.seg.lg button { height: 26px; padding: 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.red { color: var(--red); background: var(--red-soft); border-color: transparent; }
.tag.orange { color: var(--orange); background: var(--orange-soft); border-color: transparent; }
.tag.yellow { color: var(--yellow); background: var(--yellow-soft); border-color: transparent; }
.tag.blue { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
.tag.green { color: var(--green); background: var(--green-soft); border-color: transparent; }
.tag.violet { color: var(--violet); background: var(--violet-soft); border-color: transparent; }
.tag.cyan { color: var(--cyan); background: var(--cyan-soft); border-color: transparent; }
.op-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 0; }
.op-tag .ell { max-width: 100%; }
.proc { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; letter-spacing: -.02em; color: var(--ink); }
.proc .d { color: var(--ink-3); }
.uf { display: inline-block; font: 600 9.5px/1 var(--mono); padding: 3px 4px; border-radius: 3px; background: var(--cyan-soft); color: var(--cyan); margin-right: 6px; vertical-align: 1px; letter-spacing: .02em; }
.ptag { display: inline-grid; place-items: center; min-width: 34px; height: 18px; padding: 0 4px; border-radius: 4px; font: 600 9.5px/1 var(--mono); letter-spacing: .03em; }
.urg { font: 700 9px/1 var(--mono); letter-spacing: .06em; padding: 3px 5px; border-radius: 3px; background: var(--red); color: #fff; flex: none; }
.due { font: 500 12px var(--mono); white-space: nowrap; letter-spacing: -.01em; }
.due.late { color: var(--red); }
.due.today { color: var(--orange); }
.due.soon { color: var(--yellow); }
.due.later { color: var(--ink-3); }
.due.done { color: var(--green); }
.imp { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.imp i { width: 3px; border-radius: 1px; background: var(--line-strong); }
.imp i:nth-child(1) { height: 5px; } .imp i:nth-child(2) { height: 8px; } .imp i:nth-child(3) { height: 12px; }
.imp[data-v="alta"] i { background: var(--red); }
.imp[data-v="media"] i:nth-child(-n+2) { background: var(--ink-2); }
.imp[data-v="baixa"] i:nth-child(1) { background: var(--ink-2); }
.imp-urg { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; background: var(--red); color: #fff; font: 700 10px/1 var(--mono); }
.dif { display: inline-flex; gap: 2px; align-items: center; height: 12px; }
.dif i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.dif[data-v="alta"] i { background: var(--orange); border-color: var(--orange); }
.dif[data-v="media"] i:nth-child(-n+2) { background: var(--ink-2); border-color: var(--ink-2); }
.dif[data-v="baixa"] i:nth-child(1) { background: var(--ink-2); border-color: var(--ink-2); }
.avs { display: flex; }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 8.5px/1 var(--mono); color: var(--ink-2); background: var(--surface-2); border: 1.5px solid var(--surface); box-shadow: 0 0 0 1px var(--line); margin-left: -4px; }
.av:first-child { margin-left: 0; }
.av.pj { border-radius: 5px; }
.bar { position: relative; width: 100%; min-width: 60px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--green); }
.pct { font: 500 11.5px var(--mono); color: var(--ink-2); }
.kind { font: 500 9.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 9px; background: var(--ink); color: var(--ground); box-shadow: var(--shadow-lg); font-size: 12.5px; animation: toast .2s ease-out; max-width: calc(100% - 32px); }
@keyframes toast { from { transform: translate(-50%, 8px); opacity: 0; } }

/* ─── Hoje ─── */
.hello { font-size: 28px; font-weight: 600; letter-spacing: -.025em; margin: 6px 0; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 66ch; margin: 0; font-size: 13.5px; }
.lede b { color: var(--ink); font-weight: 500; }
.proto-note { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 3px 8px; margin-top: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); margin: 22px 0 20px; overflow: hidden; }
.kpi { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px 13px; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; color: inherit; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi:hover { background: var(--hover); }
.kpi-l { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.kpi-l svg { color: var(--ink-3); }
.kpi-v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi-v small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.kpi-s { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-s.red { color: var(--red); } .kpi-s.orange { color: var(--orange); } .kpi-s.violet { color: var(--violet); }
.spark { position: absolute; right: 14px; top: 38px; display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.spark i { width: 4px; border-radius: 1px; background: var(--line-strong); min-height: 1px; }
.spark i.last { background: var(--accent); }

/* ─── Intimações ─── */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.sel-wrap { position: relative; display: inline-flex; align-items: center; }

.sel-wrap select { height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); padding: 0 28px 0 10px; appearance: none; -webkit-appearance: none; font-size: 12.5px; cursor: pointer; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.list-h { display: grid; grid-template-columns: 18px minmax(0, 2.6fr) minmax(0, 1.3fr) minmax(0, 1fr) 34px 44px 92px; column-gap: 14px; padding: 8px 14px; font-size: 11px; color: var(--ink-3); border-bottom: 1px solid var(--line); }

.i-row { position: relative; display: grid; grid-template-columns: 18px minmax(0, 2.6fr) minmax(0, 1.3fr) minmax(0, 1fr) 34px 44px 92px; align-items: center; column-gap: 14px; min-height: 48px; padding: 8px 14px; border-top: 1px solid var(--line); cursor: pointer; }

.i-row:hover { background: var(--hover); }

.i-row.done { opacity: .72; }
.i-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }

.i-note svg { flex: none; }

.i-sub { display: none; }
.c-proc { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.c-proc .cls { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-op { min-width: 0; }
.c-imp, .c-dif { display: flex; justify-content: center; }
.c-due { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.c-due .sub { font: 400 10.5px var(--mono); color: var(--ink-3); }
.st-ic { display: grid; place-items: center; }

.board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.b-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-width: 0; }
.b-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-weight: 500; }
.b-h .n { font: 500 11px var(--mono); color: var(--ink-3); }
.b-list { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 10px; }
.b-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; text-align: left; color: inherit; width: 100%; }
.b-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }

.b-card .ev { font-size: 12px; color: var(--ink-2); }
.b-card .nt { font-size: 11.5px; color: var(--ink-3); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; border-left: 2px solid var(--line-strong); padding-left: 7px; }
.b-empty { font-size: 12px; color: var(--ink-3); padding: 10px 6px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }

/* ─── Detalhe (gaveta e foco) ─── */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slide .2s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes slide { from { transform: translateX(28px); opacity: .5; } }
.dr-top { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--line); flex: none; padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; }
.dr-top .crumb { flex: 1; font-size: 12.5px; }
.dr-body { flex: 1; overflow-y: auto; padding: 18px 20px 28px; }
.dr-foot { flex: none; display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; align-items: center; }

.d-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.d-title { font-size: 19px; font-weight: 600; letter-spacing: -.015em; margin: 10px 0 3px; text-wrap: balance; line-height: 1.25; }
.d-ev { color: var(--ink-2); margin: 0; font-size: 13.5px; }
.sec-t { font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
.sec-t .n { color: var(--ink-3); }
.sec-t .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: var(--font); }
.ruler { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 12px; background: var(--surface-2); margin-top: 16px; }
.ruler-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ruler-big { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.ruler-big.late { color: var(--red); } .ruler-big.today { color: var(--orange); } .ruler-big.soon { color: var(--yellow); } .ruler-big.done { color: var(--green); }
.ruler-s { font-size: 12px; color: var(--ink-3); }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin: 14px 4px 10px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-3); opacity: .55; }
.track .fill.late { background: var(--red); opacity: .75; }
.track .mk { position: absolute; top: 50%; width: 2px; height: 12px; transform: translate(-50%, -50%); background: var(--ink-3); border-radius: 1px; }
.track .mk.final { width: 10px; height: 10px; border-radius: 2px; transform: translate(-50%, -50%) rotate(45deg); background: var(--ink); }
.track .mk.ed { background: var(--violet); }
.track .now { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--accent); border: 2px solid var(--surface-2); box-shadow: 0 0 0 1px var(--accent); }
.ruler-l { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.ruler-l b { display: block; font: 500 12px var(--mono); color: var(--ink); }
.ruler-l .ed b { color: var(--violet); }
.ruler-foot { font-size: 11px; color: var(--ink-3); margin-top: 8px; }
.gram { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 8px 16px; align-items: end; }
.gram-f { display: flex; flex-direction: column; gap: 6px; }
.gram-f > span { font-size: 11.5px; color: var(--ink-3); }
.urg-t { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-2); }
.urg-t.on { background: var(--red); border-color: var(--red); color: #fff; }
.props { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 9px 12px; align-items: baseline; margin: 0; }
.props dt { color: var(--ink-3); font-size: 12px; }
.props dd { margin: 0; min-width: 0; }
.copy { border: 0; background: none; color: var(--ink-3); padding: 2px 4px; border-radius: 4px; vertical-align: -3px; }
.copy:hover { color: var(--ink); background: var(--hover); }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { padding: 9px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
.note time { display: block; font: 400 10.5px var(--mono); color: var(--ink-3); margin-bottom: 3px; }
.note-add { display: flex; gap: 8px; align-items: flex-end; }
.note-add textarea { flex: 1; min-height: 38px; height: 38px; resize: vertical; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); outline: none; color: var(--ink); }
.note-add textarea:focus { border-color: var(--accent); }
.ctx { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ctx-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.ctx-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: center; }
.ctx-row .s { font-size: 11.5px; color: var(--ink-3); grid-column: 1 / -1; }
.presc { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 7px; border-radius: 5px; white-space: nowrap; font-weight: 500; }
.presc.g1 { background: var(--red-soft); color: var(--red); }
.presc.g2 { background: var(--orange-soft); color: var(--orange); }
.presc.g3 { background: var(--yellow-soft); color: var(--yellow); }
.presc.g4 { background: var(--blue-soft); color: var(--blue); }

.ev-list { display: flex; flex-direction: column; }
.ev-it { display: grid; grid-template-columns: 56px 12px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 4px 0; font-size: 12px; }

.form { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2); margin-top: 18px; }

.input { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); outline: none; color: var(--ink); width: 100%; }
.input:focus { border-color: var(--accent); }
textarea.input { height: 64px; padding: 8px 10px; resize: vertical; }
select.input { appearance: none; -webkit-appearance: none; }
.form-acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.minuta { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 12.5px; }

.focus-wrap { max-width: 1120px; margin: 0 auto; }
.focus-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.focus-top .cnt { font: 500 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
.progress { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.focus { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.focus-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 20px; box-shadow: var(--shadow); min-width: 0; }
.focus-card .d-title { font-size: 24px; margin-top: 12px; }
.focus-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.focus-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-3); font-size: 12px; margin-top: 14px; }
.keys span { display: inline-flex; gap: 6px; align-items: center; }
.focus-done { text-align: left; padding: 40px 28px; }

/* ─── Paleta ⌘K ─── */
.pal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding: max(10vh, 16px) 16px 16px; background: var(--scrim); animation: fade .12s ease-out; }
.pal { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: 100%; }
.pal-in { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; color: var(--ink-3); }
.pal-in input { flex: 1; border: 0; background: none; outline: none; font-size: 14.5px; color: var(--ink); min-width: 0; }
.pal-chips { display: flex; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.pal-chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.pal-chip.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.pal-list { overflow-y: auto; padding: 4px 6px 8px; min-height: 120px; }
.pal-sec { font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 12px 8px 5px; }
.pal-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 5px 8px; border: 0; border-radius: 7px; background: none; text-align: left; color: var(--ink); }
.pal-item.sel { background: var(--hover); }
.pal-item .ic { color: var(--ink-3); display: grid; }
.pal-item .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pal-item .tt small { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-item .go { color: var(--ink-3); opacity: 0; }
.pal-item.sel .go { opacity: 1; }
.pal-item mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
.pal-none { padding: 26px 12px; color: var(--ink-3); font-size: 12.5px; }
.pal-foot { display: flex; gap: 14px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 11.5px; flex: none; flex-wrap: wrap; }
.pal-foot span { display: inline-flex; gap: 5px; align-items: center; }

/* ─── Linha do tempo ─── */
.tl-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tl-tools .sp { flex: 1; }
.tl { display: grid; grid-template-columns: 300px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.tl-l { border-right: 1px solid var(--line); min-width: 0; background: var(--surface); position: relative; z-index: 2; }
.tl-hd { height: 50px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; padding: 0 12px 8px; font-size: 11.5px; color: var(--ink-3); }
.tl-rl { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.tl-rl.child { padding-left: 26px; }
.tl-rl.sub { padding-left: 34px; color: var(--ink-2); font-size: 12px; }
.tl-rl.sub.child { padding-left: 48px; }
.tl-rl.ms { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
.tl-rl .who { font-size: 11.5px; color: var(--ink-3); }
.tl-rl .lbl2 { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.tl-r { overflow-x: auto; overflow-y: hidden; position: relative; }
.tl-cv { position: relative; }
.tl-axis { height: 50px; border-bottom: 1px solid var(--line); position: relative; background: var(--surface); }
.tl-major { position: absolute; top: 7px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--line-strong); height: 14px; line-height: 14px; }
.tl-tick { position: absolute; bottom: 7px; font: 500 10.5px var(--mono); color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; }
.tl-tick.we { opacity: .55; }
.tl-grid { position: absolute; top: 50px; bottom: 0; width: 1px; background: var(--grid); }
.tl-grid.strong { background: var(--line); }
.tl-shade { position: absolute; top: 50px; bottom: 0; background: var(--grid); }

function Intimacoes(p) {

function Ruler(p) {

  var biz = bizBetween(0, i.due);
  var big, sub;
  if (done) { big = 'Respondida em ' + dm(i.resp ? i.resp.at : 0); sub = (i.resp ? i.resp.type + (i.resp.piece ? ' · ' + i.resp.piece : '') : ''); }
  else if (i.due < 0) { big = 'Vencida há ' + (-i.due) + (i.due === -1 ? ' dia' : ' dias'); sub = 'final em ' + dmy(i.due); }
  else if (i.due === 0) { big = 'Vence hoje'; sub = 'final em ' + dmy(i.due); }
  else { big = 'Faltam ' + i.due + (i.due === 1 ? ' dia' : ' dias'); sub = biz + (biz === 1 ? ' útil' : ' úteis') + ' · final em ' + dmy(i.due); }
  var edTxt = ed < 0 ? 'expirado' : ed === 0 ? 'hoje' : bizBetween(0, ed) + 'd úteis';
  return html`<div className="ruler">
    <div className="ruler-h"><span className=${'ruler-big ' + (done ? 'done' : info.tone)}>${big}</span><span className="ruler-s">${sub}</span></div>
    <div className="track" aria-hidden="true">

      <i className="mk" style=${{ left: pos(i.sent) + '%' }} title=${'Envio ' + dm(i.sent)}></i>
      <i className="mk" style=${{ left: pos(i.start) + '%' }} title=${'Início ' + dm(i.start)}></i>
      <i className="mk ed" style=${{ left: pos(ed) + '%' }} title=${'Embargos de declaração até ' + dm(ed)}></i>
      <i className="mk final" style=${{ left: pos(i.due) + '%' }} title=${'Final ' + dm(i.due)}></i>
      ${!done ? html`<i className="now" style=${{ left: pos(0) + '%' }} title="Hoje"></i>` : null}
    </div>
    <div className="ruler-l">
      <span>Envio<b>${dm(i.sent)}</b></span>
      <span>Início<b>${dm(i.start)}</b></span>
      <span className="ed">Emb. decl. · ${edTxt}<b>${dm(ed)}</b></span>
      <span>Final<b>${dm(i.due)}</b></span>
    </div>
    <div className="ruler-foot">Prazos contados em dobro para a Fazenda Nacional (art. 183 do CPC). Embargos de declaração: 10 dias úteis do início.</div>
  </div>`;
}

/* ═════════════════════ Linha do tempo ═════════════════════ */
var SCALES = {
  semanas: { ppd: 22, from: -28, to: 49 },
  meses: { ppd: 3.2, from: -320, to: 250 },
  anos: { ppd: 0.62, from: -3050, to: 1460 },

var ROW = 36, AXIS = 50;
function buildRows(opId, intims) {

  var procs = PROCS.filter(function (p) { return p.op === opId; });
  var tops = procs.filter(function (p) { return !p.parent; });
  tops.forEach(function (p) {
    rows.push({ kind: 'proc', p: p });
    if (p.presc) rows.push({ kind: 'presc', p: p });
    intims.filter(function (i) { return i.proc === p.id && i.st !== 'analisado'; }).forEach(function (i) { rows.push({ kind: 'prazo', i: i, p: p }); });
    procs.filter(function (c) { return c.parent === p.id; }).forEach(function (c) {
      rows.push({ kind: 'proc', p: c, child: true });
      intims.filter(function (i) { return i.proc === c.id && i.st !== 'analisado'; }).forEach(function (i) { rows.push({ kind: 'prazo', i: i, p: c, child: true }); });
    });
  });
  return rows;
}
function Timeline(p) {
  var opId = p.op;

  function x(d) { return (d - sc.from) * sc.ppd; }

  var axis = [], grid = [];

      if (wd === 6) grid.push(html`<span key=${'w' + d} className="tl-shade" style=${{ left: x(d), width: sc.ppd * 2 }}></span>`);
      if (dd === 1 || d === sc.from) axis.push(html`<span key=${'m' + d} className="tl-major" style=${{ left: x(d) }}>${MES_L[mm]} ${D.getFullYear()}</span>`);
      if (wd === 1) grid.push(html`<span key=${'g' + d} className="tl-grid" style=${{ left: x(d) }}></span>`);
    } else if (p.scale === 'meses') {
      if (dd === 1) { axis.push(html`<span key=${'t' + d} className="tl-tick" style=${{ left: x(d) + 15 * sc.ppd }}>${MES[mm]}</span>`); grid.push(html`<span key=${'g' + d} className="tl-grid strong" style=${{ left: x(d) }}></span>`); }
      else if (wd === 1) grid.push(html`<span key=${'g' + d} className="tl-grid" style=${{ left: x(d) }}></span>`);
      if ((dd === 1 && mm === 0) || d === sc.from) axis.push(html`<span key=${'y' + d} className="tl-major" style=${{ left: x(d) }}>${D.getFullYear()}</span>`);
    } else {
      if (dd === 1 && mm % 3 === 0) { axis.push(html`<span key=${'t' + d} className="tl-tick" style=${{ left: x(d) + 45 * sc.ppd }}>${'T' + (mm / 3 + 1)}</span>`); grid.push(html`<span key=${'g' + d} className=${'tl-grid' + (mm === 0 ? ' strong' : '')} style=${{ left: x(d) }}></span>`); }
      if ((dd === 1 && mm === 0) || d === sc.from) axis.push(html`<span key=${'y' + d} className="tl-major" style=${{ left: x(d) }}>${D.getFullYear()}</span>`);
    }
  }

  var yOf = {};
  rows.forEach(function (r, k) { if (r.kind === 'proc') yOf[r.p.id] = AXIS + k * ROW + ROW / 2; });
  var H = AXIS + rows.length * ROW;
  var links = [];
  PROCS.filter(function (q) { return q.op === opId; }).forEach(function (q) {
    if (q.parent && yOf[q.parent] != null) links.push([q.start, yOf[q.parent], q.start, yOf[q.id]]);
    (q.covers || []).forEach(function (c) { if (yOf[c] != null) links.push([q.start, yOf[q.id], q.start, yOf[c]]); });

  var evC = { marco: 'var(--ink-2)', constricao: 'var(--cyan)', decisao: 'var(--green)', audiencia: 'var(--orange)' };

  var msItems = [];

    (q.events || []).forEach(function (e) { if (e.k === 'audiencia' || e.k === 'decisao') msItems.push({ d: e.d, l: e.l, c: evC[e.k] }); });

  });

  var nextRev = o.review.last + o.review.every;
  msItems.push({ d: nextRev, l: 'Revisão ' + o.review.label, c: 'var(--accent)' });
  msItems.sort(function (a, b) { return a.d - b.d; });

  function rowLeft(r, k) {
    if (r.kind === 'ms') return html`<div key=${k} className="tl-rl ms"><${Icon} n="flag" s=${13} />Marcos da operação<span className="nav-count" style=${{ marginLeft: 'auto' }}>${msItems.length}</span></div>`;
    if (r.kind === 'proc') return html`<div key=${k} className=${'tl-rl' + (r.child ? ' child' : '')} title=${r.p.cls + ' · ' + r.p.num}><${PTag} t=${r.p.tag} /><span className="lbl2 ell"><span className="ell" style=${{ fontWeight: 500 }}>${r.p.party}</span><span className="who ell mono">${r.p.num}</span></span></div>`;
    if (r.kind === 'presc') return html`<div key=${k} className="tl-rl sub"><${Icon} n="hourglass" s=${13} style=${{ color: 'var(--violet)' }} /><span className="ell">Prescrição · art. 40 LEF</span></div>`;
    return html`<div key=${k} className=${'tl-rl sub' + (r.child ? ' child' : '')}><${StatusIcon} s=${r.i.st} /><span className="ell">${r.i.ev.replace(/ — \d+ dias$/, '')}</span></div>`;
  }
  function rowRight(r, k) {
    var inner = [];
    if (r.kind === 'ms') {

      vis.forEach(function (m, j) {
        var X = x(m.d);
        var next = vis[j + 1];
        var room = next ? x(next.d) - X - 14 : 200;
        inner.push(html`<span key=${'d' + j} className=${'tl-dm' + (m.big ? ' lg' : '')} style=${{ left: X, '--c': m.c }} title=${dmy(m.d) + ' · ' + m.l}></span>`);
        if (room >= 90) inner.push(html`<span key=${'l' + j} className="tl-dm-l" style=${{ left: X, maxWidth: Math.min(room, 220) }}>${m.l}</span>`);

  function run(it) { if (!it) return; it.run(); if (!it.keep) p.onClose(); }
  function onKey(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(Math.min(flat.length - 1, selC + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(Math.max(0, selC - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); run(flat[selC]); }
    else if (e.key === 'Escape') { e.preventDefault(); p.onClose(); }
    else if (e.key === 'Tab') { e.preventDefault(); var k = PAL_CATS.findIndex(function (c) { return c[0] === cat; }); setCat(PAL_CATS[(k + (e.shiftKey ? PAL_CATS.length - 1 : 1)) % PAL_CATS.length][0]); setSel(0); }
  }
  useEffect(function () { var el = listRef.current && listRef.current.querySelector('.pal-item.sel'); if (el) el.scrollIntoView({ block: 'nearest' }); }, [selC, q, cat]);
  function mark(text) {
    var t = norm(q).trim().split(/\s+/)[0];
    if (!t || t.length < 2) return text;
    var k = norm(text).indexOf(t);
    if (k < 0) return text;
    return [text.slice(0, k), html`<mark key="m">${text.slice(k, k + t.length)}</mark>`, text.slice(k + t.length)];
  }
  var n = -1;
  return html`<div className="pal-wrap" onMouseDown=${function (e) { if (e.target === e.currentTarget) p.onClose(); }}>
    <div className="pal" role="dialog" aria-modal="true" aria-label="Buscar">
      <div className="pal-in"><${Icon} n="search" /><input id="pal-q" ref=${inRef} value=${q} onInput=${function (e) { setQ(e.target.value); setSel(0); }} onKeyDown=${onKey} placeholder="Buscar intimações, processos, CDAs, pessoas, operações…" aria-label="Buscar" autoComplete="off" autoFocus /><kbd>Esc</kbd></div>
      <div className="pal-chips">${PAL_CATS.map(function (c) { return html`<button key=${c[0]} type="button" className=${'pal-chip' + (cat === c[0] ? ' on' : '')} onClick=${function () { setCat(c[0]); setSel(0); if (inRef.current) inRef.current.focus(); }}><${Icon} n=${c[2]} s=${12} />${c[1]}</button>`; })}</div>
      <div className="pal-list" ref=${listRef}>
        ${flat.length ? sections.map(function (s) {
          return html`<div key=${s[0]}><div className="pal-sec">${s[0]}</div>${s[1].map(function (it) {
            n++; var me = n;
            return html`<button key=${s[0] + me} type="button" className=${'pal-item' + (me === selC ? ' sel' : '')} onMouseMove=${function () { if (sel !== me) setSel(me); }} onClick=${function () { run(it); }}>
              <span className="ic"><${Icon} n=${it.ic} /></span>
              <span className="tt"><span className="ell">${mark(it.title)}</span>${it.sub ? html`<small>${it.sub}</small>` : null}</span>
              <span className="go"><${Icon} n="enter" s=${14} /></span>
            </button>`;
          })}</div>`;
        }) : html`<div className="pal-none">Nada encontrado para “${q}”. Dica: números de processo e de CDA funcionam sem pontuação.</div>`}
      </div>
      <div className="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd>navegar</span><span><kbd>↵</kbd>abrir</span><span><kbd>Tab</kbd>filtro</span><span style=${{ marginLeft: 'auto' }}>NEXUS</span></div>
    </div>
  </div>`;
}

/* ═════════════════════ Nova intimação ═════════════════════ */
function NewIntim(p) {
  var fS = useState({ num: '', party: '', ev: '', due: 10, op: 'fn', imp: 'media', dif: 'media' }); var f = fS[0], setF = fS[1];
  function upd(k) { return function (e) { var x = Object.assign({}, f); x[k] = e && e.target ? e.target.value : e; setF(x); }; }
  var ok = f.party.trim() && f.ev.trim();
  useEffect(function () { function k(e) { if (e.key === 'Escape') p.onClose(); } window.addEventListener('keydown', k); return function () { window.removeEventListener('keydown', k); }; }, []);
  return html`<div className="modal-wrap" onMouseDown=${function (e) { if (e.target === e.currentTarget) p.onClose(); }}>
    <form className="modal" role="dialog" aria-modal="true" aria-label="Nova intimação" onSubmit=${function (e) { e.preventDefault(); if (!ok) return; p.onSave(f); }}>
      <div className="modal-h"><h2>Nova intimação</h2><button type="button" className="icon-btn" onClick=${p.onClose} aria-label="Fechar"><${Icon} n="x" /></button></div>
      <div className="modal-b">
        <label>Parte adversa<input id="n-party" className="input" value=${f.party} onInput=${upd('party')} placeholder="Ex.: Comercial Fachada Norte LTDA" autoFocus /></label>
        <label>Evento / prazo<input id="n-ev" className="input" value=${f.ev} onInput=${upd('ev')} placeholder="Ex.: Expedida/certificada a intimação eletrônica 10 dias" /></label>
        <div className="form row2" style=${{ padding: 0, border: 0, background: 'none', margin: 0 }}>
          <label>Processo<input id="n-num" className="input mono" value=${f.num} onInput=${upd('num')} placeholder="5000000-00.2026.4.04.7000" /></label>
          <label>Final do prazo em (dias)<input id="n-due" className="input" type="number" value=${f.due} onInput=${upd('due')} /></label>
        </div>
        <label>Operação vinculada<select id="n-op" className="input" value=${f.op} onChange=${upd('op')}>${OPS.map(function (o) { return html`<option key=${o.id} value=${o.id}>${o.name}</option>`; })}</select></label>
        <div className="gram">
          <div className="gram-f"><span>Importância</span><${Seg} label="Importância" value=${f.imp} onChange=${upd('imp')} options=${[['baixa', 'Baixa'], ['media', 'Média'], ['alta', 'Alta']]} /></div>
          <div className="gram-f"><span>Complexidade</span><${Seg} label="Complexidade" value=${f.dif} onChange=${upd('dif')} options=${[['baixa', 'Baixa'], ['media', 'Média'], ['alta', 'Alta']]} /></div>
        </div>
      </div>
      <div className="modal-f"><button type="button" className="btn ghost" onClick=${p.onClose}>Cancelar</button><button type="submit" className="btn primary" disabled=${!ok} style=${{ opacity: ok ? 1 : .5 }}>Criar intimação</button></div>
    </form>
  </div>`;
}

/* ═════════════════════ App ═════════════════════ */
var CRUMBS = { hoje: 'Hoje', intimacoes: 'Intimações', tarefas: 'Tarefas', mesa: 'Mesa', carteira: 'Carteira', timeline: 'Linha do tempo', prazos: 'Prazos extintivos', agenda: 'Agenda', processos: 'Processos', pessoas: 'Pessoas e bens', biblioteca: 'Biblioteca', acompanhar: 'Acompanhar', importar: 'Importar', briefing: 'Briefing' };
var HASHES = ['hoje', 'intimacoes', 'foco', 'carteira', 'timeline', 'prazos'];
function App() {
  var initial = (function () { var hs = (location.hash || '').slice(1); return HASHES.indexOf(hs) >= 0 ? hs : 'hoje'; })();
  var rS = useState({ name: initial === 'foco' ? 'intimacoes' : initial }); var route = rS[0], setRoute = rS[1];
  var dS = useLS('nx-claude-dir', 'auto'); var dir = dS[0], setDir = dS[1];
  var iS = useState(INTIMS0); var intims = iS[0], setIntims = iS[1];
  var drS = useState(null); var drawerId = drS[0], setDrawerId = drS[1];
  var palS = useState(false); var pal = palS[0], setPal = palS[1];
  var sdS = useState(false); var sideOpen = sdS[0], setSideOpen = sdS[1];
  var vS = useState(initial === 'foco' ? 'foco' : 'lista'); var view = vS[0], setView = vS[1];
  var scS = useState('meses'); var scale = scS[0], setScale = scS[1];
  var tS = useState(null); var toastMsg = tS[0], setToast = tS[1];
  var nS = useState(false); var newOpen = nS[0], setNewOpen = nS[1];
  var ooS = useLS('nx-claude-openops', { fn: true }); var openOps = ooS[0], setOpenOps = ooS[1];
  var contentRef = useRef(null);
  var toastT = useRef(null);

  var toast = useCallback(function (m) { setToast(m); clearTimeout(toastT.current); toastT.current = setTimeout(function () { setToast(null); }, 2600); }, []);
  var go = useCallback(function (r) { setRoute(r); setSideOpen(false); if (contentRef.current) contentRef.current.scrollTop = 0; }, []);
  var patch = useCallback(function (id, pt) { setIntims(function (list) { return list.map(function (i) { return i.id === id ? Object.assign({}, i, pt) : i; }); }); }, []);
  var openIntim = useCallback(function (id) { setDrawerId(id); }, []);

  var order = useMemo(function () {
    var src = route.name === 'op' ? intims.filter(function (i) { return i.op === route.op; }) : intims;
    return src.filter(function (i) { return i.st !== 'analisado'; }).sort(sortFn('atencao')).map(function (i) { return i.id; });
  }, [intims, route]);

  useEffect(function () {
    function onKey(e) {
      var k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); setPal(function (v) { return !v; }); return; }
      if (pal || newOpen) return;
      if (e.key === '/' && !isTyping(e)) { e.preventDefault(); setPal(true); return; }
      if (e.key === 'Escape') { if (drawerId) setDrawerId(null); else if (sideOpen) setSideOpen(false); return; }
      if (drawerId && !isTyping(e) && !e.metaKey && !e.ctrlKey) {
        var ix = order.indexOf(drawerId);
        if (k === 'j' && ix >= 0 && ix < order.length - 1) setDrawerId(order[ix + 1]);
        if (k === 'k' && ix > 0) setDrawerId(order[ix - 1]);
      }
    }
    window.addEventListener('keydown', onKey);
    return function () { window.removeEventListener('keydown', onKey); };
  }, [pal, newOpen, drawerId, sideOpen, order]);

  var crumbs = [];
  if (route.name === 'op') crumbs = ['Carteira', OPS_BY[route.op].name];
  else if (route.op && route.name !== 'timeline') crumbs = [OPS_BY[route.op].name, CRUMBS[route.name]];
  else crumbs = [CRUMBS[route.name]];
  if (route.name === 'intimacoes' && view === 'foco') crumbs = ['Intimações', 'Foco'];

  var common = { intims: intims, go: go, openIntim: openIntim, patch: patch, toast: toast, drawerId: drawerId, route: route };
  var page;
  if (route.name === 'hoje') page = html`<${Hoje} ...${common} />`;
  else if (route.name === 'intimacoes') page = html`<${Intimacoes} ...${common} view=${view} setView=${setView} blocked=${!!drawerId || pal || newOpen} />`;
  else if (route.name === 'timeline') page = html`<${TimelinePage} ...${common} scale=${scale} setScale=${setScale} />`;
  else if (route.name === 'carteira') page = html`<${Carteira} ...${common} />`;
  else if (route.name === 'op') page = html`<${OpPage} key=${route.op} ...${common} />`;
  else if (route.name === 'prazos') page = html`<${Prazos} ...${common} />`;
  else page = html`<${Soon} name=${route.name} op=${route.op} go=${go} />`;

  return html`<div className=${'nx' + (sideOpen ? ' side-open' : '')} data-dir=${dir === 'auto' ? null : dir}>
    <${Sidebar} route=${route} go=${go} intims=${intims} dir=${dir} setDir=${setDir} onSearch=${function () { setPal(true); setSideOpen(false); }} openOps=${openOps} setOpenOps=${setOpenOps} toast=${toast} />
    <div className="side-scrim" onClick=${function () { setSideOpen(false); }}></div>
    <div className="main">
      <${Topbar} crumbs=${crumbs} onSearch=${function () { setPal(true); }} onMenu=${function () { setSideOpen(true); }} onNew=${function () { setNewOpen(true); }} />
      <main className="content" ref=${contentRef}>${page}</main>
    </div>
    ${drawerId ? html`<${Drawer} id=${drawerId} intims=${intims} order=${order} openIntim=${openIntim} patch=${patch} toast=${toast} onClose=${function () { setDrawerId(null); }} />` : null}
    ${pal ? html`<${Palette} intims=${intims} go=${go} openIntim=${openIntim} setDir=${setDir} setView=${setView} setScale=${setScale} onClose=${function () { setPal(false); }} />` : null}
    ${newOpen ? html`<${NewIntim} onClose=${function () { setNewOpen(false); }} onSave=${function (f) {
      var id = 'n' + Date.now();
      var due = parseInt(f.due, 10) || 0;
      var procId = (PROCS.filter(function (q) { return q.op === f.op && q.tag === 'EF'; })[0] || PROCS[0]).id;
      setIntims(function (l) { return [{ id: id, op: f.op, proc: procId, uf: 'PR', party: f.party.trim(), ev: f.ev.trim(), sent: 0, start: 1, due: due, st: 'pendente_analise', imp: f.imp, dif: f.dif, urg: false, obj: '—', notes: [], num: f.num.trim() || PROC_BY[procId].num, cls: PROC_BY[procId].cls }].concat(l); });
      setNewOpen(false); toast('Intimação criada. Ela já aparece na fila.'); setDrawerId(id);
    }} />` : null}
    ${toastMsg ? html`<div className="toast" role="status"><${Icon} n="tick" s=${14} />${toastMsg}</div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
