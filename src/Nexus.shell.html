  --font-display: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-ui: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,24,32,0.05), 0 6px 20px rgba(20,24,32,0.07);

  --cx-ground: #f2f3f5; --cx-panel: #ebedf0; --cx-surface: #ffffff; --cx-surface-2: #f6f7f9; --cx-hover: #e7e9ed;
  --cx-line: #dcdfe4; --cx-line-strong: #c7cbd2;
  --cx-ink: #14161a; --cx-ink-2: #4d535e; --cx-ink-3: #7c828e;
  --cx-accent: #8a6722; --cx-accent-soft: #f4ecdb; --cx-btn: #1b1e24; --cx-btn-hover: #2c3039; --cx-btn-ink: #ffffff;
  --cx-red: #c2323d; --cx-red-soft: #fbe8e9; --cx-orange: #bf5f16; --cx-orange-soft: #fcefe3;
  --cx-yellow: #946b00; --cx-yellow-soft: #f8efd2; --cx-blue: #2d62d3; --cx-blue-soft: #e7eefc;
  --cx-green: #21845a; --cx-green-soft: #e2f3eb; --cx-violet: #6a4fd4; --cx-violet-soft: #eeeafc;
  --cx-cyan: #0f7888; --cx-cyan-soft: #e0f3f5;
  --cx-op1: #2d62d3; --cx-op2: #bf5f16; --cx-op3: #21845a; --cx-op4: #6a4fd4; --cx-op5: #0f7888; --cx-op6: #b3386b;
  --cx-shadow: 0 1px 2px rgba(20,24,32,0.05), 0 6px 20px rgba(20,24,32,0.07);
  --cx-shadow-lg: 0 24px 64px rgba(20,24,32,0.22);
  --cx-scrim: rgba(18,20,26,0.34);
  --cx-font: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --cx-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
  grid-template-columns: 244px minmax(0, 1fr);
  background: var(--bg-deep);
  font-family: var(--cx-font);
}
.app-layout.edition-claude.sidebar-collapsed { grid-template-columns: 244px minmax(0, 1fr); }
.app-layout.edition-claude .sidebar,
.app-layout.edition-claude .top-nav { display: none; }
.app-layout.edition-claude .main-content { background: var(--bg-deep); }
.app-layout.edition-claude .btn-primary { background: var(--cx-btn); color: var(--cx-btn-ink); }
.app-layout.edition-claude .btn-primary:hover { background: var(--cx-btn-hover); box-shadow: none; }
.app-layout.edition-claude .btn-secondary { background: var(--cx-surface); }
.app-layout.edition-claude .btn-secondary:hover { background: var(--cx-hover); }
.app-layout.edition-claude .modal-overlay { background: rgba(18,20,26,0.34); backdrop-filter: blur(2px); }
.app-layout.edition-claude .modal { box-shadow: var(--cx-shadow-lg); border-color: var(--cx-line-strong); }
.app-layout.edition-claude .global-search-overlay { background: rgba(18,20,26,0.34); backdrop-filter: blur(2px); padding-top: 10vh; }
.app-layout.edition-claude .global-search-box { border: 1px solid var(--cx-line-strong); border-radius: 12px; box-shadow: var(--cx-shadow-lg); overflow: hidden; }
.app-layout.edition-claude .gs-input-wrap input { font-family: var(--cx-font); font-size: 14.5px; background: transparent; }
.app-layout.edition-claude .settings-panel { box-shadow: var(--cx-shadow-lg); border-color: var(--cx-line-strong); }

/* ─── Reset de baixa especificidade (só dentro dos componentes cx) ─── */
:where(.cx) button { font: inherit; color: inherit; padding: 0; border: 0; border-radius: 0; background: none; transition: none; font-weight: inherit; letter-spacing: inherit; text-align: inherit; }
:where(.cx) input, :where(.cx) select, :where(.cx) textarea { font: inherit; color: inherit; width: auto; padding: 0; border-radius: 0; min-height: 0; transition: none; box-shadow: none; }
:where(.cx) input:focus, :where(.cx) select:focus, :where(.cx) textarea:focus { box-shadow: none; }
.cx { font-family: var(--cx-font); font-size: 13px; line-height: 1.45; color: var(--cx-ink); -webkit-font-smoothing: antialiased; }
.cx :focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 1px; }
.cx-i { flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.cx-mono { font-family: var(--cx-mono); letter-spacing: -0.01em; }
.cx-ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cx-muted { color: var(--cx-ink-3); }
.cx-small { font-size: 11.5px; }
.cx-minw0 { min-width: 0; }
.cx-sp { flex: 1; }
.cx-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.cx-kbd { font: 500 10.5px/1 var(--cx-mono); padding: 3px 5px; border: 1px solid var(--cx-line); border-bottom-width: 2px; border-radius: 4px; color: var(--cx-ink-3); background: var(--cx-surface-2); white-space: nowrap; }
.cx-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }

/* ─── Menu lateral ─── */
.cx-side { background: var(--cx-panel); border-right: 1px solid var(--cx-line); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.cx-side-head { display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 8px 0 12px; flex: none; }
.cx-brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; padding: 4px 6px; margin-left: -6px; border-radius: 6px; cursor: pointer; }
.cx-brand:hover { background: var(--cx-hover); }
.cx-brand-mark { position: relative; width: 24px; height: 24px; border-radius: 6px; background: var(--cx-ink); color: var(--cx-ground); display: grid; place-items: center; font: 600 12px/1 var(--cx-mono); flex: none; }
.cx-brand-mark::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--cx-accent); border: 2px solid var(--cx-panel); }
.cx-brand-name { display: block; font-weight: 600; letter-spacing: 0.04em; font-size: 12.5px; line-height: 1.2; }
.cx-brand-sub { display: block; font-size: 11px; color: var(--cx-ink-3); line-height: 1.3; }
.cx-icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--cx-ink-3); flex: none; cursor: pointer; }
.cx-icon-btn:hover { background: var(--cx-hover); color: var(--cx-ink); }
.cx-icon-btn.on { color: var(--cx-accent); background: var(--cx-accent-soft); }
.cx-icon-btn.cx-sm { width: 22px; height: 22px; }
.cx-side-close { display: none; }
.cx-side-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 14px; min-height: 0; }
.cx-nav { display: flex; flex-direction: column; gap: 1px; }
.cx-nav-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--cx-ink-2); white-space: nowrap; cursor: pointer; }
.cx-nav-item:hover { background: var(--cx-hover); color: var(--cx-ink); }
.cx-nav-item.on { background: var(--cx-hover); color: var(--cx-ink); font-weight: 500; }
.cx-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cx-count { font: 500 11px var(--cx-mono); color: var(--cx-ink-3); }
.cx-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--cx-accent-soft); color: var(--cx-accent); font: 600 10.5px/18px var(--cx-mono); text-align: center; }
.cx-badge.red { background: var(--cx-red-soft); color: var(--cx-red); }
.cx-nav-sec { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 500; color: var(--cx-ink-3); padding: 18px 4px 6px 8px; }
.cx-op-sq { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
.cx-chev { width: 16px; height: 16px; display: grid; place-items: center; color: var(--cx-ink-3); margin-left: -4px; transition: transform 0.15s; flex: none; }
.cx-nav-op.open .cx-chev { transform: rotate(90deg); }
.cx-nav-sub { display: flex; flex-direction: column; gap: 1px; margin: 1px 0 4px; }
.cx-nav-sub .cx-nav-item { padding-left: 32px; height: 27px; font-size: 12.5px; }
.cx-side-filter { display: flex; align-items: center; gap: 6px; height: 28px; margin: 0 2px 6px; padding: 0 8px; border: 1px solid var(--cx-line); border-radius: 6px; background: var(--cx-surface); color: var(--cx-ink-3); }
.cx-side-filter input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 12.5px; color: var(--cx-ink); }
.cx-side-empty { font-size: 12px; color: var(--cx-ink-3); padding: 6px 8px; }
.cx-side-foot { flex: none; border-top: 1px solid var(--cx-line); padding: 10px 12px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--cx-ink-3); }
.cx-link-btn { color: var(--cx-ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 5px; white-space: nowrap; cursor: pointer; }
.cx-link-btn:hover { color: var(--cx-ink); background: var(--cx-hover); }
.cx-side-scrim { display: none; }

/* ─── Barra superior ─── */
.cx-top { flex: none; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--cx-line); background: var(--cx-ground); position: relative; z-index: 5; }
.cx-menu-btn { display: none; }
.cx-crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--cx-ink-3); white-space: nowrap; overflow: hidden; }
.cx-crumb b { color: var(--cx-ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.cx-sep { opacity: 0.6; }
.cx-top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cx-sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cx-ink-3); white-space: nowrap; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.cx-sync:hover { background: var(--cx-hover); color: var(--cx-ink-2); }
.cx-search { display: flex; align-items: center; gap: 8px; height: 30px; width: 270px; padding: 0 6px 0 10px; border: 1px solid var(--cx-line); border-radius: 7px; background: var(--cx-surface); color: var(--cx-ink-3); cursor: pointer; }
.cx-search:hover { border-color: var(--cx-line-strong); color: var(--cx-ink-2); }
.cx-search .cx-t { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-banner { margin: 10px 16px 0; padding: 7px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--cx-orange) 35%, var(--cx-line)); background: var(--cx-orange-soft); display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--cx-ink-2); cursor: pointer; flex: none; min-width: 0; }
.cx-banner b { color: var(--cx-orange); font-weight: 600; white-space: nowrap; }
.cx-banner .cx-i { color: var(--cx-orange); }
.cx-banner.today { border-color: color-mix(in srgb, var(--cx-red) 40%, var(--cx-line)); background: var(--cx-red-soft); }
.cx-banner.today b, .cx-banner.today .cx-i { color: var(--cx-red); }
.cx-banner-more { margin-left: auto; color: var(--cx-ink-3); white-space: nowrap; }
.cx-settings-anchor { position: relative; }
.cx-settings-anchor .settings-panel { font-family: var(--cx-font); }

/* ─── Botões e controles ─── */
.cx-btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--cx-line); background: var(--cx-surface); color: var(--cx-ink); font-weight: 500; white-space: nowrap; cursor: pointer; font-size: 13px; }
.cx-btn:hover { background: var(--cx-hover); }
.cx-btn.primary { background: var(--cx-btn); border-color: transparent; color: var(--cx-btn-ink); }
.cx-btn.primary:hover { background: var(--cx-btn-hover); }
.cx-btn.primary .cx-kbd { background: transparent; color: inherit; border-color: currentColor; opacity: 0.55; }
.cx-btn.ghost { border-color: transparent; background: transparent; color: var(--cx-ink-2); }
.cx-btn.ghost:hover { background: var(--cx-hover); color: var(--cx-ink); }
.cx-btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.cx-seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--cx-surface-2); border: 1px solid var(--cx-line); gap: 1px; flex: none; }
.cx-seg button { height: 22px; padding: 0 8px; border-radius: 5px; color: var(--cx-ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
.cx-seg button:hover { color: var(--cx-ink); }
.cx-seg button.on { background: var(--cx-surface); color: var(--cx-ink); box-shadow: 0 0 0 1px var(--cx-line), 0 1px 2px rgba(0,0,0,0.08); }
.cx-seg.lg button { height: 26px; padding: 0 10px; }
.cx-n { font: 500 10.5px var(--cx-mono); color: var(--cx-ink-3); }
.cx-sel { position: relative; display: inline-flex; align-items: center; }
.cx-sel .cx-pre { position: absolute; left: 10px; font-size: 12px; color: var(--cx-ink-3); pointer-events: none; }
.cx-sel select { height: 30px; border: 1px solid var(--cx-line); border-radius: 7px; background: var(--cx-surface); color: var(--cx-ink); padding: 0 28px 0 10px; appearance: none; -webkit-appearance: none; font-size: 12.5px; cursor: pointer; max-width: 260px; }
.cx-sel .cx-i { position: absolute; right: 9px; pointer-events: none; color: var(--cx-ink-3); }
.cx-field { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 1px solid var(--cx-line); border-radius: 7px; background: var(--cx-surface); color: var(--cx-ink-3); width: 280px; max-width: 100%; }
.cx-field:focus-within { border-color: var(--cx-accent); }
.cx-field input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--cx-ink); font-size: 13px; }
.cx-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; color: var(--cx-ink-2); background: var(--cx-surface-2); border: 1px solid var(--cx-line); white-space: nowrap; }
.cx-chip.cx-pend { cursor: pointer; }
.cx-chip.cx-pend.on { color: var(--cx-orange); background: var(--cx-orange-soft); border-color: transparent; }
.cx-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--cx-line); color: var(--cx-ink-2); white-space: nowrap; flex: none; }
.cx-tag.blue { color: var(--cx-blue); background: var(--cx-blue-soft); border-color: transparent; }
.cx-flag { color: var(--cx-orange); display: inline-grid; }
.cx-op-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cx-ink-2); white-space: nowrap; min-width: 0; max-width: 100%; }
.cx-op-tag.cx-link { cursor: pointer; border-radius: 4px; }
.cx-op-tag.cx-link:hover { color: var(--cx-ink); text-decoration: underline; text-underline-offset: 2px; }
.cx-proc { font-family: var(--cx-mono); font-size: 11.5px; white-space: nowrap; letter-spacing: -0.02em; color: var(--cx-ink); }
.cx-d { color: var(--cx-ink-3); }
.cx-uf { display: inline-block; font: 600 9.5px/1 var(--cx-mono); padding: 3px 4px; border-radius: 3px; background: var(--cx-cyan-soft); color: var(--cx-cyan); margin-right: 6px; vertical-align: 1px; letter-spacing: 0.02em; }
.cx-urg { font: 700 9px/1 var(--cx-mono); letter-spacing: 0.06em; padding: 3px 5px; border-radius: 3px; background: var(--cx-red); color: #fff; flex: none; margin-right: 6px; }
.cx-due { font: 500 12px var(--cx-mono); white-space: nowrap; letter-spacing: -0.01em; }
.cx-due.late { color: var(--cx-red); }
.cx-due.today { color: var(--cx-orange); }
.cx-due.soon { color: var(--cx-yellow); }
.cx-due.later, .cx-due.none { color: var(--cx-ink-3); }
.cx-due.done { color: var(--cx-green); }
.cx-imp { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
.cx-imp i { width: 3px; border-radius: 1px; background: var(--cx-line-strong); }
.cx-imp i:nth-child(1) { height: 5px; } .cx-imp i:nth-child(2) { height: 8px; } .cx-imp i:nth-child(3) { height: 12px; }
.cx-imp[data-v="alta"] i { background: var(--cx-red); }
.cx-imp[data-v="normal"] i:nth-child(-n+2) { background: var(--cx-ink-2); }
.cx-imp[data-v="baixa"] i:nth-child(1) { background: var(--cx-ink-2); }
.cx-imp-urg { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; background: var(--cx-red); color: #fff; font: 700 10px/1 var(--cx-mono); }
.cx-dif { display: inline-flex; gap: 2px; align-items: center; height: 12px; flex: none; }
.cx-dif i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--cx-line-strong); }
.cx-dif[data-v="alta"] i { background: var(--cx-orange); border-color: var(--cx-orange); }
.cx-dif[data-v="media"] i:nth-child(-n+2) { background: var(--cx-ink-2); border-color: var(--cx-ink-2); }
.cx-dif[data-v="baixa"] i:nth-child(1) { background: var(--cx-ink-2); border-color: var(--cx-ink-2); }
.cx-st-ic { display: grid; place-items: center; flex: none; }
.cx-avs { display: flex; }
.cx-av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 8.5px/1 var(--cx-mono); color: var(--cx-ink-2); background: var(--cx-surface-2); border: 1.5px solid var(--cx-surface); box-shadow: 0 0 0 1px var(--cx-line); margin-left: -4px; }
.cx-av:first-child { margin-left: 0; }
.cx-av.pj { border-radius: 5px; }
.cx-bar { position: relative; display: block; width: 96px; height: 5px; border-radius: 3px; background: var(--cx-line); overflow: hidden; }
.cx-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--cx-green); }
.cx-pct { font: 500 11.5px var(--cx-mono); color: var(--cx-ink-2); }
.cx-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cx-ink-2); white-space: nowrap; }
.cx-kind { font: 500 9.5px/1 var(--cx-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--cx-ink-3); padding: 3px 5px; border: 1px solid var(--cx-line); border-radius: 4px; white-space: nowrap; }
.cx-gnum { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font: 600 10.5px/1 var(--cx-mono); color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); flex: none; }
.cx-a { display: inline-flex; align-items: center; gap: 4px; color: var(--cx-blue); text-decoration: none; margin-left: 6px; }
.cx-a:hover { text-decoration: underline; }
.cx-copy { color: var(--cx-ink-3); padding: 2px 4px; border-radius: 4px; vertical-align: -3px; margin-left: 4px; cursor: pointer; }
.cx-copy:hover { color: var(--cx-ink); background: var(--cx-hover); }
.cx-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1300; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 9px; background: var(--cx-ink); color: var(--cx-ground); box-shadow: var(--cx-shadow-lg); font: 12.5px var(--cx-font); animation: cxToast 0.2s ease-out; max-width: calc(100% - 32px); }
@keyframes cxToast { from { transform: translate(-50%, 8px); opacity: 0; } }
.cx-toast .cx-i { stroke: currentColor; }

/* ─── Páginas ─── */
.cx-page { max-width: 1200px; margin: 0 auto; padding: 28px 32px 72px; }
.cx-page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.cx-page-h h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.cx-page-h p { margin: 4px 0 0; color: var(--cx-ink-2); max-width: 70ch; }
.cx-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cx-eyebrow { font: 500 11px var(--cx-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--cx-ink-3); }
.cx-hello { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin: 6px 0; line-height: 1.2; text-wrap: balance; }
.cx-lede { color: var(--cx-ink-2); max-width: 70ch; margin: 0; font-size: 13.5px; }
.cx-lede b { color: var(--cx-ink); font-weight: 500; }
.cx-card { background: var(--cx-surface); border: 1px solid var(--cx-line); border-radius: 10px; min-width: 0; }
.cx-card-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-height: 44px; padding: 7px 10px 7px 14px; }
.cx-card-h h2 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
.cx-aside { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.cx-pad { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.cx-empty-row { padding: 16px 14px; border-top: 1px solid var(--cx-line); color: var(--cx-ink-3); font-size: 12.5px; }
.cx-more { font-size: 11.5px; color: var(--cx-ink-3); padding: 6px 14px 10px; border-top: 1px solid var(--cx-line); }

/* ─── Hoje ─── */
.cx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--cx-line); border-radius: 10px; background: var(--cx-surface); margin: 22px 0 20px; overflow: hidden; }
.cx-kpi { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px 13px; border-left: 1px solid var(--cx-line); text-align: left; min-width: 0; cursor: pointer; }
.cx-kpi:first-child { border-left: 0; }
.cx-kpi:hover { background: var(--cx-hover); }

/* ═══ Fase 2 · Carteira, Visão geral, Linha do tempo, Mesa de prazos ═══ */

.cx-tl-l2 { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.cx-tl-who { font-size: 11px; color: var(--cx-ink-3); }

.cx-tl-cv { position: relative; }
.cx-tl-axis { height: 50px; border-bottom: 1px solid var(--cx-line); position: relative; background: var(--cx-surface); }
.cx-tl-major { position: absolute; top: 7px; font-size: 11.5px; font-weight: 500; color: var(--cx-ink-2); white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--cx-line-strong); height: 14px; line-height: 14px; }
.cx-tl-tick { position: absolute; bottom: 7px; font: 500 10.5px var(--cx-mono); color: var(--cx-ink-3); transform: translateX(-50%); white-space: nowrap; }
.cx-tl-tick.we { opacity: 0.55; }
.cx-tl-grid { position: absolute; top: 50px; bottom: 0; width: 1px; background: color-mix(in srgb, var(--cx-line) 55%, transparent); }

.cx-tl-bar.open-end { border-right-style: dashed; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }

.cx-tl-bar.prazo { top: 10px; height: 16px; font-size: 11px; cursor: pointer; color: var(--cx-ink); border-color: color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 22%, var(--cx-surface)); }
.cx-tl-bar.prazo:hover { background: color-mix(in srgb, var(--c) 32%, var(--cx-surface)); }
.cx-tl-lbl { overflow: hidden; text-overflow: ellipsis; position: sticky; left: 8px; }
.cx-tl-seg { position: absolute; top: 11px; height: 14px; border-radius: 3px; }
.cx-tl-seg.susp { background: repeating-linear-gradient(135deg, var(--cx-blue-soft) 0 5px, color-mix(in srgb, var(--cx-blue) 30%, transparent) 5px 7px); border: 1px solid color-mix(in srgb, var(--cx-blue) 40%, transparent); }
.cx-tl-seg.inter { background: linear-gradient(90deg, color-mix(in srgb, var(--cx-violet) 14%, transparent), color-mix(in srgb, var(--cx-violet) 55%, transparent)); border: 1px solid color-mix(in srgb, var(--cx-violet) 45%, transparent); }
.cx-tl-seg.pausa { background: repeating-linear-gradient(135deg, var(--cx-green-soft) 0 5px, color-mix(in srgb, var(--cx-green) 30%, transparent) 5px 7px); border: 1px solid color-mix(in srgb, var(--cx-green) 40%, transparent); }

.cx-tl-seg-l { position: absolute; top: 0; height: 36px; display: flex; align-items: center; font-size: 11px; color: var(--cx-ink-2); white-space: nowrap; pointer-events: none; padding-left: 6px; }
.cx-tl-dm { position: absolute; top: 18px; width: 10px; height: 10px; transform: translate(-50%, -50%) rotate(45deg); border-radius: 2px; background: var(--c); box-shadow: 0 0 0 2px var(--cx-surface); z-index: 1; }
.cx-tl-dm.lg { width: 12px; height: 12px; }
.cx-tl-dm.hollow { background: var(--cx-surface); border: 1.5px dashed var(--c); }
.cx-tl-dm-l { position: absolute; top: 0; height: 36px; line-height: 36px; font-size: 11px; color: var(--cx-ink-2); white-space: nowrap; padding-left: 10px; pointer-events: none; overflow: hidden; text-overflow: ellipsis; }
.cx-tl-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--cx-accent); z-index: 3; pointer-events: none; }
.cx-tl-today span { position: absolute; top: 28px; left: 0; transform: translateX(-50%); font: 600 10px/1 var(--cx-mono); background: var(--cx-accent); color: #fff; padding: 3px 5px; border-radius: 4px; white-space: nowrap; }
.cx-tl-hint { position: sticky; left: 12px; display: inline-flex; align-items: center; height: 36px; font-size: 11.5px; color: var(--cx-ink-3); white-space: nowrap; font-style: italic; }
.cx-tl-rl.click { cursor: pointer; }
.cx-tl-rl.click:hover { background: var(--cx-hover); }
.cx-tl-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.cx-tl-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 11.5px; color: var(--cx-ink-3); align-items: center; }
.cx-tl-legend > span { display: inline-flex; align-items: center; gap: 7px; }
.cx-lg-sw { display: inline-block; width: 22px; height: 10px; border-radius: 3px; }
.cx-tl-legend .cx-tl-seg { position: static; }
.cx-tl-dm.cx-lg { position: static; display: inline-block; transform: rotate(45deg); width: 9px; height: 9px; box-shadow: none; }

/* Visão geral da operação */
.cx-op-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cx-op-hero { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.cx-op-hero h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.cx-sq-lg { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.cx-op-lede { margin-top: 6px; }
.cx-op-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cx-optabs { display: flex; gap: 2px; margin: 18px 0 0; border-bottom: 1px solid var(--cx-line); overflow-x: auto; scrollbar-width: none; }
.cx-optabs::-webkit-scrollbar { display: none; }
.cx-optabs button { height: 36px; padding: 0 11px; color: var(--cx-ink-3); font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.cx-optabs button:hover { color: var(--cx-ink); }
.cx-optabs button.on { color: var(--cx-ink); border-bottom-color: var(--cx-ink); font-weight: 500; }
.cx-stats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border: 1px solid var(--cx-line); border-radius: 10px; background: var(--cx-surface); margin: 18px 0 8px; overflow: hidden; }
.cx-stat { display: flex; flex-direction: column; gap: 1px; padding: 12px 14px; border-left: 1px solid var(--cx-line); min-width: 0; text-align: left; }
.cx-stat:first-child { border-left: 0; }
.cx-stat.click { cursor: pointer; }
.cx-stat.click:hover { background: var(--cx-hover); }
.cx-stat-l { font-size: 11.5px; color: var(--cx-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-stat-v { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-stat-v.red { color: var(--cx-red); }
.cx-stat-v.violet { color: var(--cx-violet); }
.cx-stat-s { font-size: 11px; color: var(--cx-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-sub-h { display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; }
.cx-sub-h h2 { font-size: 14px; font-weight: 600; margin: 0; }
.cx-q-row.cx-q-compact { grid-template-columns: 18px minmax(0, 1fr) 18px 74px; }

/* Mesa de prazos extintivos */
.cx-pz-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--cx-line); border-radius: 10px; background: var(--cx-surface); margin: 4px 0 16px; overflow: hidden; }
.cx-pz-tile { display: flex; flex-direction: column; gap: 2px; padding: 13px 16px 12px; border-left: 1px solid var(--cx-line); text-align: left; min-width: 0; cursor: pointer; }
.cx-pz-tile:first-child { border-left: 0; }
.cx-pz-tile:hover { background: var(--cx-hover); }
.cx-pz-l { font-size: 12px; color: var(--cx-ink-2); white-space: nowrap; }
.cx-pz-v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
.cx-pz-s { font-size: 11.5px; color: var(--cx-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-pz-s.orange { color: var(--cx-orange); }
.cx-pz-tile.need .cx-pz-v { color: var(--cx-red); }
.cx-pz-tile.need .cx-pz-l { color: var(--cx-ink); font-weight: 500; }
.cx-pz-people { margin: -4px 0 12px; }
.cx-pz-block { margin-bottom: 14px; overflow: hidden; scroll-margin-top: 16px; }
.cx-pz-more { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 9px 14px; border-top: 1px solid var(--cx-line); color: var(--cx-ink-2); font-size: 12.5px; cursor: pointer; }
.cx-pz-more:hover { background: var(--cx-hover); color: var(--cx-ink); }
.cx-pz-fold { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px; padding: 0 14px; text-align: left; cursor: pointer; }
.cx-pz-fold:hover { background: var(--cx-hover); }
.cx-pz-fold b { font-weight: 600; white-space: nowrap; }
.cx-pz-fold-s { margin-left: auto; font-size: 12px; color: var(--cx-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cx-pz-fold-s.orange { color: var(--cx-orange); }
.cx-pz-gh { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--cx-surface-2); border-top: 1px solid var(--cx-line); font-size: 12.5px; font-weight: 500; color: var(--cx-ink-2); }
.cx-mesa-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; padding: 12px 14px 11px 18px; border-top: 1px solid var(--cx-line); }
.cx-mesa-row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); opacity: 0.55; }
.cx-mesa-row.g1::before { opacity: 1; }
.cx-mesa-row.venc { background: color-mix(in srgb, var(--cx-red-soft) 55%, var(--cx-surface)); }
.cx-mesa-row .cx-gnum { color: var(--c); }
.cx-mesa-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.cx-mesa-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cx-mesa-cda { font-size: 12.5px; font-weight: 500; color: var(--cx-ink); }
.cx-cert { display: inline-flex; align-items: center; font: 500 10px/1 var(--cx-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; white-space: nowrap; cursor: help; }
.cx-cert.calculado { color: var(--cx-blue); background: var(--cx-blue-soft); border: 1px solid transparent; }
.cx-cert.estimado { color: var(--cx-yellow); background: var(--cx-yellow-soft); border: 1px dashed color-mix(in srgb, var(--cx-yellow) 55%, transparent); }
.cx-cert.cadastro { color: var(--cx-ink-3); background: var(--cx-surface-2); border: 1px dotted var(--cx-line-strong); }
.cx-mesa-why { font-size: 13px; color: var(--cx-ink); line-height: 1.4; }
.cx-mesa-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; min-width: 0; }
.cx-mesa-meta .cx-op-tag { max-width: 240px; }
.cx-mesa-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; text-align: right; }
.cx-mesa-when { font: 600 13px var(--cx-mono); letter-spacing: -0.01em; white-space: nowrap; color: var(--cx-ink); }
.cx-mesa-when.red { color: var(--cx-red); }
.cx-mesa-date { font: 400 11px var(--cx-mono); color: var(--cx-ink-3); white-space: nowrap; }
.cx-mesa-val { font-size: 12px; color: var(--cx-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cx-mesa-acts { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cx-mesa-parc { display: inline-flex; align-items: center; gap: 6px; }
.cx-mesa-parc .cx-input { height: 26px; width: 150px; font-size: 12px; }
.cx-snooze { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; padding: 11px 12px; border: 1px solid var(--cx-line-strong); border-radius: 8px; background: var(--cx-surface-2); }
.cx-snooze label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--cx-ink-3); }
.cx-snooze .cx-input { height: 28px; width: auto; min-width: 170px; font-size: 12.5px; }
.cx-snooze-note { flex: 1 1 220px; }
.cx-snooze-note .cx-input { width: 100%; }
.cx-snooze-hint { flex: 1 1 100%; font-size: 11.5px; color: var(--cx-ink-3); }
.cx-snooze-acts { margin-left: auto; display: flex; gap: 6px; }
.cx-sil-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--cx-line); font-size: 12.5px; }
.cx-sil-why { color: var(--cx-ink-2); }
.cx-sil-until { font-size: 11.5px; color: var(--cx-ink-3); white-space: nowrap; }
.cx-pz-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 4px; font-size: 11.5px; color: var(--cx-ink-3); }
.cx-pz-legend > span { display: inline-flex; align-items: center; gap: 8px; }

@media (max-width: 1180px) {
  .cx-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cx-stat:nth-child(5) { border-left: 0; }
  .cx-stat:nth-child(n+5) { border-top: 1px solid var(--cx-line); }
  .cx-tl { grid-template-columns: 240px minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .cx-stats, .cx-pz-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cx-stat:nth-child(odd), .cx-pz-tile:nth-child(odd) { border-left: 0; }
  .cx-stat:nth-child(even), .cx-pz-tile:nth-child(even) { border-left: 1px solid var(--cx-line); }
  .cx-stat:nth-child(n+3), .cx-pz-tile:nth-child(n+3) { border-top: 1px solid var(--cx-line); }
  .cx-pz-v { font-size: 22px; }
  .cx-tl { grid-template-columns: 150px minmax(0, 1fr); }
  .cx-tl-who, .cx-tl-rl .cx-ptag { display: none; }
  .cx-op-actions { width: 100%; }
  .cx-mesa-row { padding-left: 16px; }
  .cx-sil-row { grid-template-columns: minmax(0, 1fr) auto; }
  .cx-sil-row .cx-sil-why { grid-column: 1 / -1; grid-row: 2; }
  .cx-pz-fold-s { display: none; }
}

/* ═══ Fase 3 · Tarefas, Agenda, Mesa de trabalho ═══ */
.cx-desk-btn { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--cx-line); background: var(--cx-surface); color: var(--cx-ink-3); font-size: 11.5px; white-space: nowrap; cursor: pointer; }
.cx-desk-btn:hover { color: var(--cx-ink); border-color: var(--cx-line-strong); }
.cx-desk-btn.on { color: var(--cx-blue); background: var(--cx-blue-soft); border-color: transparent; }

/* Tarefas */
.cx-quick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px 6px 12px; margin-bottom: 12px; border: 1px solid var(--cx-line); border-radius: 10px; background: var(--cx-surface); }
.cx-quick:focus-within { border-color: var(--cx-accent); }
.cx-quick-t { flex: 1 1 260px; min-width: 0; height: 32px; border: 0; outline: 0; background: none; font-size: 13.5px; color: var(--cx-ink); }
.cx-quick .cx-input { width: auto; height: 30px; font-size: 12.5px; }
.cx-quick-d { width: 150px; }
.cx-quick-o { max-width: 190px; }
.cx-t-row { position: relative; display: grid; grid-template-columns: 18px minmax(0, 2.6fr) minmax(0, 1.3fr) 34px auto 96px; column-gap: 14px; align-items: center; min-height: 48px; padding: 8px 14px; border-top: 1px solid var(--cx-line); cursor: pointer; }
.cx-t-row:hover { background: var(--cx-hover); }
.cx-t-row.urgent::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 0 2px 2px 0; background: var(--cx-red); }
.cx-t-row.done { opacity: 0.72; }
.cx-t-row.done .cx-t-title .cx-ell { text-decoration: line-through; text-decoration-color: var(--cx-ink-3); }
.cx-tcheck { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--cx-ink-3); display: grid; place-items: center; color: #fff; cursor: pointer; flex: none; }
.cx-tcheck:hover { border-color: var(--cx-green); background: var(--cx-green-soft); }
.cx-tcheck.on { background: var(--cx-green); border-color: var(--cx-green); }
.cx-t-title { display: flex; align-items: center; gap: 7px; font-weight: 500; min-width: 0; }
.cx-t-title .cx-urg { margin-right: 0; }
.cx-t-row .cx-c-proc { gap: 3px; }
.cx-t-acts { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.cx-board.cx-board-3 { grid-template-columns: repeat(3, minmax(250px, 1fr)); }
.cx-b-card.cx-b-done { opacity: 0.7; }

/* Agenda */
.cx-ag-nav { display: inline-flex; align-items: center; gap: 4px; }
.cx-ag-label { font-size: 14px; font-weight: 600; white-space: nowrap; }
.cx-ag-total { align-self: center; margin-left: auto; }
.cx-ag-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--cx-line); border-radius: 10px; background: var(--cx-surface); overflow: hidden; }
.cx-ag-grid > :nth-child(7n+1) { border-left: 0; }
.cx-ag-mh { padding: 7px 10px; font-size: 11px; color: var(--cx-ink-3); background: var(--cx-surface-2); border-left: 1px solid var(--cx-line); }
.cx-ag-day { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 340px; padding: 8px 6px 10px; border-left: 1px solid var(--cx-line); }
.cx-ag-grid.month .cx-ag-day { min-height: 116px; gap: 3px; border-top: 1px solid var(--cx-line); padding: 6px 5px 8px; }
.cx-ag-day.we { background: color-mix(in srgb, var(--cx-surface-2) 60%, var(--cx-surface)); }
.cx-ag-day.today { background: color-mix(in srgb, var(--cx-accent-soft) 55%, var(--cx-surface)); }
.cx-ag-day.past .cx-ag-it { opacity: 0.8; }
.cx-ag-day.out { opacity: 0.45; }
.cx-ag-dh { display: flex; align-items: baseline; gap: 6px; padding: 0 4px 2px; }
.cx-ag-dow { font-size: 11px; color: var(--cx-ink-3); }
.cx-ag-n { font: 600 13px var(--cx-mono); color: var(--cx-ink-2); }
.cx-ag-n.today { background: var(--cx-accent); color: #fff; border-radius: 10px; padding: 1px 7px; }
.cx-ag-its { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.cx-ag-it { display: flex; flex-direction: column; gap: 2px; width: 100%; min-width: 0; text-align: left; padding: 5px 7px 6px; border-radius: 5px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--cx-surface)); font-size: 12px; cursor: pointer; }
.cx-ag-it:hover { background: color-mix(in srgb, var(--c) 16%, var(--cx-surface)); }
.cx-ag-it.compact { padding: 2px 6px; font-size: 11px; border-left-width: 2px; }
.cx-ag-t { display: flex; align-items: center; gap: 5px; min-width: 0; font-weight: 500; }
.cx-ag-t b { font-size: 11px; color: var(--c); font-weight: 600; }
.cx-ag-s { font-size: 11px; color: var(--cx-ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cx-ag-op { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--cx-ink-3); min-width: 0; }
.cx-ag-urg { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 3px; background: var(--cx-red); color: #fff; font: 700 9px/1 var(--cx-mono); flex: none; }
.cx-ag-more { font-size: 11px; color: var(--cx-ink-3); text-align: left; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
.cx-ag-more:hover { color: var(--cx-ink); background: var(--cx-hover); }
.cx-ag-empty { color: var(--cx-line-strong); text-align: center; padding: 6px 0; }
.cx-ag-lday { border-top: 1px solid var(--cx-line); }
.cx-ag-lday:first-child { border-top: 0; }
.cx-ag-lh { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--cx-surface-2); }

<script>
// ═══════════════════════════════════════════════════════════════════
// GLOBAL TOOLTIP PORTAL
// Fixes tooltips that were being clipped by overflow:hidden/auto parents.
// Uses event delegation + a single fixed-position element appended to body.
// Supports all tooltip families: .has-tip, .intim-center-text-wrap,
// .task-desc-wrap, .note-stack.
// ═══════════════════════════════════════════════════════════════════
(function initTooltipPortal() {
  const tt = document.createElement('div');
  tt.id = '__nexus_tt__';
  tt.style.cssText = 'position:fixed;display:none;z-index:99999;pointer-events:none;background:#1a1f2e;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:10px 14px;font-size:11px;color:#e8ecf2;line-height:1.6;max-width:440px;min-width:180px;box-shadow:0 8px 28px rgba(0,0,0,0.65);white-space:normal;word-break:break-word;font-weight:400;';
  const attach = () => { if (document.body && !document.getElementById('__nexus_tt__')) document.body.appendChild(tt); };
  if (document.body) attach(); else document.addEventListener('DOMContentLoaded', attach);

  // Trigger → tooltip child selector mappings. Order matters: first match wins.
  const configs = [
    { trigger: '.has-tip', childSel: ':scope > .tip-content' },
    { trigger: '.task-desc-wrap', childSel: ':scope > .task-desc-tooltip' },
    { trigger: '.note-stack', childSel: ':scope > .intim-tooltip' },
    { trigger: '.intim-center-text-wrap', childSel: ':scope > .intim-tooltip' }
  ];

  const findTrigger = (el) => {
    if (!el || !el.closest) return null;
    // Find the NEAREST matching trigger (not the outermost), so nested has-tips work
    let best = null;
    for (const c of configs) {
      const t = el.closest(c.trigger);
      if (!t) continue;
      const child = t.querySelector(c.childSel);
      if (!child) continue;
      if (!best || t.contains(best.trigger)) best = { trigger: t, content: child.innerHTML, cfg: c };
    }
    return best;
  };

  let currentTrigger = null;
  const show = (t, html) => {
    tt.innerHTML = html;
    tt.style.display = 'block';
    // Measure after content set
    const ttR = tt.getBoundingClientRect();
    const r = t.getBoundingClientRect();
    const preferBelow = !!document.querySelector('.app-layout.edition-demo');
    let top = preferBelow ? (r.bottom + 8) : (r.top - ttR.height - 8);
    let left = r.left + (r.width / 2) - (ttR.width / 2);
    if (!preferBelow && top < 10) top = r.bottom + 8;
    if (preferBelow && top + ttR.height > window.innerHeight - 8) top = r.top - ttR.height - 8;
    // Keep within viewport horizontally
    if (left < 8) left = 8;
    if (left + ttR.width > window.innerWidth - 8) left = window.innerWidth - ttR.width - 8;
    // If even below would overflow, pin to bottom of viewport
    if (top + ttR.height > window.innerHeight - 8) top = window.innerHeight - ttR.height - 8;
    tt.style.top = top + 'px';
    tt.style.left = left + 'px';
    currentTrigger = t;
  };
  const hide = () => { tt.style.display = 'none'; currentTrigger = null; };

  document.addEventListener('mouseover', (e) => {
    const found = findTrigger(e.target);
    if (found && found.trigger !== currentTrigger) show(found.trigger, found.content);
  }, true);

  document.addEventListener('mouseout', (e) => {
    // If moving to a child of current trigger, don't hide
    if (currentTrigger && e.relatedTarget && currentTrigger.contains(e.relatedTarget)) return;
    // If the related target is still a tooltip trigger, let mouseover handle it
    const relFound = e.relatedTarget ? findTrigger(e.relatedTarget) : null;
    if (relFound) return; // will be shown by mouseover
    hide();
  }, true);

  // Hide on scroll/resize to avoid stale positioning
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
  // Hide on click (common UX expectation)
  document.addEventListener('click', hide, true);
})();
</script>
