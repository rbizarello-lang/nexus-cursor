<style>
:root {
  /* Referência: cards quase no tom do fundo; leitura por borda (baixo contraste) */
  --bg-deep: #17263f;
  --bg-main: #192941;
  --bg-card: #1b2b44;
  --bg-card-hover: #20304a;
  --bg-elevated: #1d2e48;
  --bg-input: #182840;
  --border: #2a3d58;
  --border-light: #3a5270;
  --text-primary: #e8edf5;
  --text-secondary: #8ea0b8;
  --text-muted: #5a7088;
  --accent: #c8a04a;
  --accent-dim: rgba(200,160,74,0.10);
  --accent-glow: rgba(200,160,74,0.20);
  --pgfn: #9b2848;
  --pgfn-light: #b83060;
  --pgfn-dim: rgba(155,40,72,0.12);
  --red: #e54060;
  --red-dim: rgba(229,64,96,0.12);
  --yellow: #d4a838;
  --yellow-dim: rgba(212,168,56,0.12);
  --blue: #5b8fd9;
  --blue-dim: rgba(91,143,217,0.12);
  --purple: #7a8ba3;
  --purple-dim: rgba(122,139,163,0.12);
  --green: #40a870;
  --green-dim: rgba(64,168,112,0.12);
  --orange: #d88840;
  --orange-dim: rgba(216,136,64,0.12);
  --cyan: #4da8b8;
  --cyan-dim: rgba(77,168,184,0.12);
  --gold: #c8a04a;
  --gold-dim: rgba(200,160,74,0.10);
  --font-display: 'Public Sans', 'Inter', system-ui, sans-serif;
  --font-ui: 'Public Sans', 'Inter', system-ui, sans-serif;
  --font-body: 'Public Sans', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
}
/* ─── Theme: Mar Profundo (crepúsculo oceânico · azuis médios) ─── */
.theme-mar {
  --bg-deep: #1c2f4a;
  --bg-main: #223656;
  --bg-card: #274062;
  --bg-card-hover: #2e4a6e;
  --bg-elevated: #2a4568;
  --bg-input: #1e334e;
  --border: #3a5474;
  --border-light: #4a6888;
  --text-primary: #eaf0f7;
  --text-secondary: #b0c2d6;
  --text-muted: #849ab4;
  --accent: #c4a36a;
  --accent-dim: rgba(196,163,106,0.14);
  --accent-glow: rgba(196,163,106,0.22);
  --gold: #c4a36a;
  --gold-dim: rgba(196,163,106,0.14);
  --pgfn: #b84a66;
  --pgfn-light: #d0607c;
  --pgfn-dim: rgba(184,74,102,0.16);
  --red: #e06b7e;
  --red-dim: rgba(224,107,126,0.14);
  --yellow: #d4b45a;
  --yellow-dim: rgba(212,180,90,0.14);
  --blue: #7eb0d6;
  --blue-dim: rgba(126,176,214,0.14);
  --green: #6fbf90;
  --green-dim: rgba(111,191,144,0.14);
  --orange: #d4925a;
  --orange-dim: rgba(212,146,90,0.14);
  --cyan: #6db8c4;
  --cyan-dim: rgba(109,184,196,0.14);
  --purple: #8a9bb0;
  --purple-dim: rgba(138,155,176,0.14);
  --shadow: 0 1px 8px rgba(0,0,0,0.28);
}
.app-layout.theme-mar {
  background:
    radial-gradient(1000px 420px at 12% -8%, rgba(126,176,214,0.12), transparent 55%),
    radial-gradient(800px 360px at 92% 0%, rgba(196,163,106,0.05), transparent 50%),
    linear-gradient(180deg, #223656 0%, #1c2f4a 45%, #182840 100%);
}
/* ─── Theme: Claro (areia-cinza; tokens da Demo Clara / .edition-demo base) ─── */
.theme-claro {
  --bg-deep: #e0ddd6;
  --bg-main: #e5e2db;
  --bg-card: #e9e6df;
  --bg-card-hover: #ddd9d0;
  --bg-elevated: #e7e4dd;
  --bg-input: #e9e6df;
  --border: #cbc6bb;
  --border-light: #b4aea2;
  --text-primary: #1c1a16;
  --text-secondary: #454039;
  --text-muted: #6a645a;
  --demo-glass-card: #e9e6df;
  --demo-glass: rgba(233,230,223,0.94);
  --demo-glass-soft: rgba(229,226,219,0.88);
  --accent: #9a6b3a;
  --accent-dim: rgba(154,107,58,0.12);
  --accent-glow: rgba(154,107,58,0.22);
  --gold: #9a6b3a;
  --gold-dim: rgba(154,107,58,0.12);
  --pgfn: #7a1f35;
  --pgfn-light: #9b2848;
  --pgfn-dim: rgba(122,31,53,0.10);
  --red: #c2304a;
  --red-dim: rgba(194,48,74,0.10);
  --yellow: #b8860b;
  --yellow-dim: rgba(184,134,11,0.12);
  --blue: #355f7a;
  --blue-dim: rgba(53,95,122,0.10);
  --green: #2d7a52;
  --green-dim: rgba(45,122,82,0.10);
  --orange: #c46a2a;
  --orange-dim: rgba(196,106,42,0.12);
  --cyan: #2a7a86;
  --cyan-dim: rgba(42,122,134,0.10);
  --purple: #5a6b7d;
  --purple-dim: rgba(90,107,125,0.10);
  --shadow: 0 1px 6px rgba(28,26,22,0.06);
}
.app-layout.theme-claro {
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(154,107,58,0.07), transparent 55%),
    radial-gradient(900px 400px at 90% 0%, rgba(53,95,122,0.05), transparent 50%),
    linear-gradient(180deg, #e5e2db 0%, #e0ddd6 40%, #dbd7ce 100%);
}
.app-layout.theme-claro .btn-primary:hover { background: var(--pgfn-light); box-shadow: none; }
.app-layout.theme-claro .settings-panel { box-shadow: 0 8px 32px rgba(28,26,22,0.14); }
/* Superfícies “glass” do grafo: no Claro usam card/elevated (texto escuro legível) */
.app-layout.theme-claro .graph-legend,
.app-layout.theme-claro .graph-controls button,
.app-layout.theme-claro .detail-panel {
  background: var(--bg-card);
  color: var(--text-secondary);
  box-shadow: var(--shadow);
}
/* ─── Theme: Ferro e Maré (ferro escuro + azul maré, destaques bege, alerta burgundy) ─── */
.theme-ferro {
  --bg-deep: #171e27;
  --bg-main: #191f29;
  --bg-card: #1b222c;
  --bg-card-hover: #202833;
  --bg-elevated: #1d2530;
  --bg-input: #181e28;
  --border: #2a3340;
  --border-light: #3a4452;
  --text-primary: #e2ded0;
  --text-secondary: #c0c0c0;
  --text-muted: #7d8896;
  --accent: #c4a87c;
  --accent-dim: rgba(196,168,124,0.12);
  --accent-glow: rgba(196,168,124,0.20);
  --gold: #c4a87c;
  --gold-dim: rgba(196,168,124,0.12);
  --pgfn: #660000;
  --pgfn-light: #8f1f1f;
  --pgfn-dim: rgba(102,0,0,0.20);
  --blue: #5d8bc4;
  --blue-dim: rgba(93,139,196,0.14);
  --shadow: 0 1px 8px rgba(0,0,0,0.28);
}
/* ─── Font variants (settings → class on html + .app-layout) ─── */
.font-inter, html.font-inter, .app-layout.font-inter {
  --font-display: 'Inter', system-ui, sans-serif;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
.font-outfit, html.font-outfit, .app-layout.font-outfit {
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-ui: 'Outfit', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, sans-serif;
}
.font-source, html.font-source, .app-layout.font-source {
  --font-display: 'Source Sans 3', system-ui, sans-serif;
  --font-ui: 'Source Sans 3', system-ui, sans-serif;
  --font-body: 'Source Sans 3', system-ui, sans-serif;
}
/* ─── Settings panel ─── */
.settings-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 4px 8px; border-radius: var(--radius); transition: all 0.15s; }
.settings-btn:hover { color: var(--gold); background: rgba(200,160,74,0.08); }
.settings-backdrop { position: fixed; inset: 0; z-index: 199; background: transparent; }
.settings-panel { position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; min-width: 280px; max-height: calc(100vh - 80px); overflow-y: auto; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.settings-panel-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin: -4px 0 10px; }
.settings-panel-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
.settings-panel-close:hover { color: var(--text-primary); }
.settings-version {
  display: flex; flex-direction: column; gap: 2px;
  margin: -4px 0 14px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: color-mix(in srgb, var(--accent, #c8a04a) 10%, var(--bg-elevated, var(--bg-main)));
}
.settings-version strong {
  font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
  color: var(--text-primary); font-family: var(--font-mono, ui-monospace, Consolas, monospace);
}
.settings-version span {
  font-size: 10px; color: var(--text-muted); font-family: var(--font-mono, ui-monospace, Consolas, monospace);
}
.settings-group { margin-bottom: 14px; }
.settings-group:last-child { margin-bottom: 0; }
.settings-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
.settings-options { display: flex; gap: 4px; flex-wrap: wrap; }
.settings-opt { font-size: 11px; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
.settings-opt:hover { border-color: var(--border-light); background: var(--bg-elevated); }
.settings-opt.active { border-color: var(--gold); color: var(--gold); background: var(--accent-dim); }
.settings-zoom { display: flex; align-items: center; gap: 8px; }
.settings-zoom input[type=range] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 2px; outline: none; }
.settings-zoom input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 2px solid var(--bg-card); }
.settings-zoom span { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); min-width: 32px; text-align: center; }
.export-picker { max-width: 560px; display: flex; flex-direction: column; max-height: 85vh; }
.export-picker-hd { display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.export-picker-list { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.export-picker-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; background: var(--bg-elevated);
}
.export-picker-row:hover { border-color: var(--border-light); }
.export-picker-row.is-on { border-color: var(--gold); background: var(--accent-dim); }
.export-picker-row input[type="checkbox"] { width: 15px; height: 15px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }
.export-picker-row .ep-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-primary); }
.export-picker-row .ep-hint { display: block; font-size: 10px; color: var(--text-muted); margin-top: 1px; line-height: 1.35; }
.export-picker-row .ep-count { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); flex-shrink: 0; padding-top: 2px; }
.export-picker-ft { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--border); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; overflow: hidden; }
body { font-family: var(--font-body, var(--font-display)); font-size: 15px; background: var(--bg-deep); color: var(--text-primary); line-height: 1.55; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
input, select, textarea {
  font-family: var(--font-mono); font-size: 12px; background: var(--bg-input); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; outline: none; transition: border-color 0.2s; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
textarea { resize: vertical; min-height: 60px; }
select { cursor: pointer; }
button { font-family: var(--font-mono); font-size: 12px; cursor: pointer; border: none; border-radius: var(--radius); padding: 8px 16px; transition: all 0.2s; font-weight: 500; }
.btn-primary { background: var(--pgfn); color: #fff; font-weight: 600; }
button:disabled, button[disabled] { opacity: 0.45 !important; cursor: not-allowed !important; filter: grayscale(0.4); }
button:disabled:hover, button[disabled]:hover { background: inherit; }
.btn-primary:hover { background: var(--pgfn-light); }
.btn-primary:hover { background: #00e6b8; box-shadow: 0 0 16px var(--accent-glow); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
.btn-danger:hover { background: rgba(244,63,94,0.25); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-xs { padding: 3px 8px; font-size: 10px; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
.badge-blue { background: var(--blue-dim); color: var(--blue); }
.badge-purple { background: var(--purple-dim); color: var(--purple); }
.badge-orange { background: var(--orange-dim); color: var(--orange); }
.badge-cyan { background: var(--cyan-dim); color: var(--cyan); }
.badge-muted { background: var(--purple-dim); color: var(--text-muted); }
.badge-muted-strong { background: var(--purple-dim); color: var(--text-secondary); border: 1px solid var(--border); }
.badge-white { background: var(--purple-dim); color: var(--text-secondary); border: 1px solid var(--border); }
.badge-green-strong { background: var(--green-dim); color: var(--green); font-weight: 600; }
.badge-brown { background: rgba(180,120,60,0.15); color: var(--yellow); }

.app-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100%;
  transition: grid-template-columns 0.25s ease;
  font-family: var(--font-body, var(--font-display));
  /* Temas (theme-claro etc.) definem tokens neste nó — a cor precisa
     resolver aqui; senão herda o texto claro do :root via body. */
  color: var(--text-primary);
  background: var(--bg-deep);
}
.app-layout.sidebar-collapsed { grid-template-columns: 40px 1fr; }
.sidebar { background: var(--bg-main); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; transition: width 0.25s ease; min-height: 0; }
.sidebar.collapsed .sidebar-search, .sidebar.collapsed .sidebar-ops, .sidebar.collapsed .sidebar-footer, .sidebar.collapsed .cloud-panel { display: none; }
.sidebar.collapsed .sidebar-header { padding: 10px 4px; text-align: center; }
.sidebar.collapsed .sidebar-header h1 { font-size: 18px; letter-spacing: 0; margin-bottom: 4px; line-height: 1; }
.sidebar.collapsed .sidebar-header > div { flex-direction: column; align-items: center; gap: 4px; }
.sidebar-toggle { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; line-height: 1; transition: color 0.15s; }
.sidebar-toggle:hover { color: var(--gold); }
.sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid rgba(200,160,74,0.15); background: linear-gradient(135deg, rgba(91,143,217,0.06) 0%, rgba(200,160,74,0.04) 100%); }
.sidebar-header h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 3px; margin-bottom: 2px; }
.sidebar-header .subtitle { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
.sidebar-search { padding: 12px 16px; }
.sidebar-search input { font-size: 12px; padding: 7px 10px; }
.sidebar-filter-btn { margin-top: 6px; width: 100%; font-size: 10px; }
.sidebar-filter-btn.is-on { border-color: var(--gold); color: var(--gold); }
.sidebar-filter-btn.is-open { background: var(--bg-elevated); }
.sidebar-filter-menu {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 240px;
  overflow-y: auto;
  padding: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.sidebar-filter-menu .settings-opt { width: 100%; text-align: left; font-size: 10px; padding: 6px 8px; }
.sidebar-ops { flex: 1; overflow-y: auto; padding: 4px 8px; }
.sidebar-op-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 2px; transition: all 0.15s; border: 1px solid transparent; }
.sidebar-op-item:hover { background: var(--bg-card); }
.sidebar-op-item.active { background: var(--pgfn-dim); border-color: rgba(139,26,58,0.3); }
.sidebar-op-item .op-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.sidebar-op-item .op-meta { font-size: 10px; color: var(--text-muted); }
/* Category rectangle border on sidebar items */
.sidebar-op-item.cat-alta { border: 1px solid rgba(244,63,94,0.35); background: rgba(244,63,94,0.02); }
.sidebar-op-item.cat-alta.active { border-color: rgba(244,63,94,0.5); background: rgba(244,63,94,0.06); }
.sidebar-op-item.cat-replicar { border: 1px solid rgba(245,158,11,0.3); background: rgba(245,158,11,0.02); }
.sidebar-op-item.cat-replicar.active { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.05); }
.sidebar-op-item.cat-nova { border: 1px solid rgba(226,232,240,0.2); background: rgba(226,232,240,0.02); }
.sidebar-op-item.cat-nova.active { border-color: rgba(226,232,240,0.4); background: rgba(226,232,240,0.04); }
.sidebar-op-item.cat-parcelada { border: 1px solid rgba(59,130,246,0.3); background: rgba(59,130,246,0.02); }
.sidebar-op-item.cat-parcelada.active { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.06); }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
.sidebar-footer button { flex: 1; font-size: 10px; min-width: 70px; }

.main-content { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-deep); min-height: 0; }
.main-header { padding: 14px 24px; background: var(--bg-main); border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 56px; flex-shrink: 0; }
.main-header h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.main-header .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 52%; }

.intim-card.prio-urgente.overdue, .intim-card.prio-urgente.due-soon { box-shadow: inset 0 0 0 1px rgba(229,64,96,0.3), 0 0 12px rgba(229,64,96,0.12); }
.intim-card.prio-baixa, .kanban-card.prio-baixa { opacity: 0.55; }
.intim-card.peca-edicao { border-left: 4px solid #4ade80; background: linear-gradient(90deg, rgba(74,222,128,0.08) 0%, var(--bg-card) 40%); }
.intim-left { min-width: 0; }
.intim-dates-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.intim-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 75px; }
.intim-center { align-self: start; display: flex; flex-direction: column; gap: 4px; min-width: 0; border-left: 1px solid rgba(30,42,58,0.3); padding-left: 12px; }
.intim-center-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.intim-center-text { font-size: 11px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; max-height: 3em; position: relative; cursor: default; }
.intim-center-text-wrap { position: relative; }
.intim-center-text-wrap .intim-tooltip { display: none; position: absolute; left: 0; top: 100%; z-index: 100; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 10px 14px; font-size: 11px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-width: 400px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none; }

/* Global tooltip portal — hide all inline tooltip templates; they're used only as data sources by the portal script at the end of the page */
.has-tip > .tip-content,
.intim-center-text-wrap > .intim-tooltip,
.task-desc-wrap > .task-desc-tooltip,

/* Multi-note stack: visual separation between multiple notes on a card */
.note-stack { position: relative; display: flex; flex-direction: column; gap: 3px; cursor: default; }
.note-stack .note-item { font-size: 10px; color: var(--text-secondary); line-height: 1.4; padding: 3px 6px 3px 8px; background: rgba(255,255,255,0.02); border-left: 2px solid var(--border); border-radius: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-stack .note-item.note-item-full { white-space: normal; overflow: visible; text-overflow: clip; padding: 6px 8px 6px 10px; line-height: 1.45; margin-bottom: 1px; word-break: break-word; }

.note-stack .intim-tooltip { display: none; position: absolute; left: 0; top: 100%; z-index: 100; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 10px 14px; font-size: 11px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-width: 500px; min-width: 250px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none; margin-top: 4px; }

/* Task card description multi-line with hover-expand */

.task-desc-wrap { position: relative; }
.task-desc-wrap .task-desc-tooltip { display: none; position: absolute; left: 0; top: 100%; z-index: 100; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 12px 16px; font-size: 11px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-width: 500px; min-width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: none; margin-top: 4px; }

.intim-doc-link { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--blue); text-decoration: none; padding: 2px 8px; background: var(--blue-dim); border-radius: 4px; transition: all 0.15s; margin-top: 2px; }

.intim-op-tag { font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 1px 6px; background: var(--accent-dim); border-radius: 4px; }
.intim-op-tag:hover { background: rgba(0,212,170,0.25); }
.intim-op-tag.unlinked { color: var(--text-muted); background: var(--bg-elevated); }
.intim-party { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; line-height: 1.3; }
.intim-proc-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 3px; }

.intim-procnum { color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; cursor: pointer; padding: 1px 4px; border-radius: 3px; transition: all 0.15s; position: relative; }
.intim-procnum:hover { background: var(--bg-elevated); color: var(--text-primary); }
.intim-procnum::after { content: '📋'; font-size: 9px; margin-left: 3px; opacity: 0; transition: opacity 0.15s; }

/* Copyable - reusable click-to-copy with feedback */
.copyable { cursor: pointer; padding: 1px 4px; border-radius: 3px; transition: all 0.15s; position: relative; display: inline; }

}

}
/* Tooltip - hover help system */
.has-tip { position: relative; cursor: help; border-bottom: 1px dotted var(--text-muted); }
.has-tip > .tip-content { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: 6px; padding: 8px 12px; font-size: 11px; color: var(--text-primary); line-height: 1.5; white-space: normal; min-width: 180px; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.15s; font-weight: 400; text-transform: none; letter-spacing: normal; }

}

}
.hover-bg:hover { background: var(--bg-elevated); }

.agenda-hearing:hover { background: rgba(212,168,56,0.18); }
.intim-procnum.copied { color: var(--accent); }
.intim-procnum.copied::after { content: '✓'; opacity: 1; color: var(--accent); }
.intim-classname { color: var(--text-muted); font-size: 10px; }
.intim-dates-row { display: flex; gap: 10px; font-size: 10px; color: var(--text-secondary); }

/* Mesa de trabalho — colunas por tipo */

}

}
.mesa-col {

}

.mesa-col-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

.mesa-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; cursor: grab; transition: border-color 0.15s, background 0.15s;
}
.mesa-card:hover { border-color: color-mix(in srgb, var(--mesa-col-color, var(--accent)) 45%, var(--border)); background: var(--bg-card-hover); }
.mesa-card:active { cursor: grabbing; opacity: 0.85; }
.mesa-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.mesa-drag { color: var(--text-muted); font-size: 12px; cursor: grab; user-select: none; }

  cursor: pointer; flex-shrink: 0; background: transparent;
}
.mesa-check:hover { border-color: var(--accent); background: var(--accent-dim); }

.mesa-card-title { font-size: 12px; font-weight: 600; color: var(--text-primary); cursor: pointer; margin-bottom: 4px; }

.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* Global search */
.global-search-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding-top: 80px; z-index: 1100; }
.global-search-box { background: var(--bg-card); border: 1px solid var(--accent); border-radius: var(--radius-lg); width: 90%; max-width: 640px; box-shadow: 0 8px 40px rgba(0,212,170,0.15); }

/* Sticky Notes */
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
/* Briefing Card — Resumo Operacional */
.briefing-card { background: linear-gradient(135deg, rgba(14,23,38,0.95) 0%, rgba(20,30,50,0.95) 100%); border: 1px solid rgba(255,255,255,0.08); border-left: 4px solid rgba(255,255,255,0.15); border-radius: var(--radius-lg); padding: 0; margin-bottom: 20px; overflow: hidden; }
.briefing-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); }

.briefing-col { padding: 14px 18px; }
.briefing-col + .briefing-col { border-left: 1px solid rgba(255,255,255,0.04); }
.briefing-split { display: flex; gap: 0; min-height: 0; }
.briefing-split-left { flex: 1; min-width: 0; padding-right: 10px; overflow-y: auto; }

.briefing-pano-strip-bar {

}

}
.b-acc { border-bottom: 1px solid rgba(255,255,255,0.06); }

.b-acc-icon.open { transform: rotate(90deg); }
.b-acc-title { font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─── Blocos de estratégia (entradas tipadas) + editor rico ─── */

/* Cloud Sync */
.cloud-panel { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; max-height: 180px; overflow-y: auto; }
.cloud-panel h5 { font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

.cloud-actions { display: flex; gap: 4px; flex-wrap: wrap; }

/* Auto-sync compact pill switch */

.autosync-pill-knob { position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: transform 0.2s, background 0.2s; }
.autosync-pill.on .autosync-pill-knob { background: var(--green); transform: translateX(12px); }
.autosync-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.autosync-pending { font-size: 9px; color: var(--text-muted); flex-shrink: 0; font-weight: 600; }

.cda-presc-inc-seal { display: inline-block; margin-left: 4px; font-size: 8px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--pgfn-dim); color: var(--pgfn-light); }
.cda-presc-chk { display: flex; gap: 6px; align-items: flex-start; font-size: 10px; line-height: 1.4; color: var(--text-secondary); margin: 3px 0; cursor: pointer; }

.cda-presc-ft { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--border); }
.cda-presc-rules { background: transparent; border: 0; padding: 0; color: var(--text-muted); font-size: 10px; cursor: pointer; }

}

.presc-rules-box { max-width: 720px; }

.presc-rules-body h1 { font-size: 16px; margin: 0 0 8px; color: var(--text-primary); }

.sidebar-op-item .op-presc-dot {

/* Pulsing alert stat-cards on operation page */

@keyframes cardPulseYellow { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); } 50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); } 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } }

/* Redesigned graph */
.graph-split { display: grid; grid-template-rows: 1fr auto; height: 100%; overflow: hidden; }
.graph-people { flex: 1; position: relative; overflow: hidden; min-height: 250px; }

/* ═══════════════════════════════════════════════════════════

/* ─── UX aprovado 31/07: resumo da operação + processos colapsáveis ─── */
.op-summary {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: 0;
  min-height: 52px;
  padding: 0 24px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  background: var(--bg-main);
  font-family: var(--font-display);
  flex-shrink: 0;
}
.op-summary-item {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  justify-content: center;
  min-width: 120px;
  padding: 8px 14px;
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  color: var(--text-secondary);
  text-align: left;
  font-family: var(--font-display);
}
button.op-summary-item:hover { background: rgba(255,255,255,.025); }
.op-summary-item small {
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.op-summary-item strong {
  margin-top: 2px;
  color: var(--text-primary);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}
.op-summary-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  margin-left: 4px;
  padding: 8px 0 8px 14px;
  border-left: 1px solid var(--border);
}
.op-summary-actions button {
  padding: 5px 10px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
}
.op-summary-actions span {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;

/* Régua de fases IDPJ/MCF/Central — sempre horizontal no desktop */
.proc-stage-ruler {
  display: flex;

  flex-wrap: nowrap;
  align-items: flex-start;

  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
}

}

  flex: 0.7 1 12px;
  height: 2px;
  min-width: 8px;
  margin-top: 6px;
  align-self: flex-start;

/* Panorama · Split record (card B) */
.pano-split {
  margin-bottom: 12px;
  border: 1px solid color-mix(in srgb, var(--pgfn, #b84a66) 28%, var(--border));
  border-left: 3px solid var(--pgfn, #b84a66);

  opacity: 1;

.pano-split.is-extinct { opacity: 0.5; }
.pano-split.tag-mcf {
  border-color: color-mix(in srgb, var(--yellow) 28%, var(--border));
  border-left-color: var(--yellow);
}
.pano-split.tag-central {
  border-color: color-mix(in srgb, var(--purple, #7a8ba3) 28%, var(--border));
  border-left-color: var(--purple, #7a8ba3);
}
.pano-split.tag-pano-ef {
  border-color: color-mix(in srgb, var(--cyan, #22d3ee) 28%, var(--border));
  border-left-color: var(--cyan, #22d3ee);
}
.pano-split-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 14px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, color-mix(in srgb, var(--pgfn, #b84a66) 8%, var(--bg-card)), var(--bg-card));
  cursor: pointer;
  user-select: none;
}
.pano-split.tag-mcf .pano-split-head {
  background: linear-gradient(180deg, color-mix(in srgb, var(--yellow) 8%, var(--bg-card)), var(--bg-card));
}
.pano-split.tag-central .pano-split-head {
  background: linear-gradient(180deg, color-mix(in srgb, var(--purple, #7a8ba3) 8%, var(--bg-card)), var(--bg-card));
}
.pano-split.tag-pano-ef .pano-split-head {
  background: linear-gradient(180deg, color-mix(in srgb, var(--cyan, #22d3ee) 8%, var(--bg-card)), var(--bg-card));
}
.pano-split-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.pano-split-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}
.pano-split-title-row h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 0;
}
.pano-split-chev { font-size: 10px; color: var(--text-muted); width: 12px; flex-shrink: 0; }
.pano-split-num {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  padding-left: 20px;
}
.pano-split-head-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  margin-left: auto;
}
.pano-split-metrics {
  display: flex;
  gap: 14px;
  flex-wrap: nowrap;
  align-items: baseline;
}
.pano-split-metrics div {
  text-align: right;
}
.pano-split-metrics div small {
  display: block;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-muted);
  line-height: 1.2;
}
.pano-split-metrics div strong {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  line-height: 1.25;
}
.pano-split-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  align-items: center;
}
@media (max-width: 820px) {
  .pano-split-head-row { flex-wrap: wrap; }
  .pano-split-head-right {
    width: 100%;
    justify-content: flex-end;
    margin-left: 0;
  }
}
.pano-split-grid {
  display: grid;
  /* Contexto compacto; Trabalho leva o espaço das informações longas */
  grid-template-columns: minmax(200px, 0.62fr) minmax(0, 1.38fr);
  min-height: 0;
}
.pano-split-col {
  padding: 12px 14px 14px;
  min-width: 0;
}
.pano-split-col + .pano-split-col {
  border-left: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.12);
}
.pano-split-col-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.pano-split-ruler { display: flex; flex-direction: column; gap: 0; margin-bottom: 4px; }
.pano-split-ruler-item {
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 8px;
  align-items: start;
  position: relative;
  padding-bottom: 10px;
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: inherit;
  padding-left: 0;
  padding-right: 0;
  padding-top: 0;
}
.pano-split-ruler-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 3px;
  top: 10px;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.pano-split-ruler-item .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 3px;
  flex-shrink: 0;
  box-sizing: border-box;
}
.pano-split-ruler-item .name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.pano-split-ruler-item.is-now {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-radius: 4px;
  margin: 0 -4px;
  padding-left: 4px;
  padding-right: 4px;
}
.pano-split-ruler-item.is-now .name { font-weight: 700; }
.pano-split-ruler-item:hover {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 4px;
  margin: 0 -4px;
  padding-left: 4px;
  padding-right: 4px;
}
.pano-split-ruler-item .meta {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 1px;
}
.pano-split-add { position: relative; margin: 2px 0 12px; }
.pano-split-ef-list { display: flex; flex-direction: column; gap: 6px; }
.pano-split-ef {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: center;
  padding: 7px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 11px;
  border-left: 3px solid color-mix(in srgb, var(--pgfn, #b84a66) 55%, var(--border));
  cursor: pointer;
  color: inherit;
  font-family: inherit;
  width: 100%;
  text-align: left;
}
.pano-split-ef.is-apenso {
  margin-left: 12px;
  width: calc(100% - 12px);
  border-left-color: var(--border-light, #444);
}
.pano-split-ef .apenso-mark {
  color: var(--text-muted);
  font-size: 11px;
  margin-right: 2px;
  flex-shrink: 0;
}
.pano-split-ef:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--bg-elevated));
}
.pano-split-ef .num {
  flex: 1 1 120px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pano-split-ef .val,
.pano-split-ef .badge { flex-shrink: 0; }
.pano-split-ef .val {
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 10px;
  white-space: nowrap;
}
.pano-split-work-phase {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.pano-split-work-list {
  font-size: 11px;
  color: var(--text-secondary);
  padding-left: 16px;
  margin: 0 0 10px;
}
.pano-split-work-list li { margin-bottom: 4px; }
.pano-split-work-list .d {
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
}
.pano-split-decision {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.45;
  max-height: 4.4em;
  overflow: hidden;
  position: relative;
  margin-bottom: 6px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.pano-split-decision.is-open { max-height: none; }
.pano-split-decision:not(.is-open)::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 1.6em;
  background: linear-gradient(transparent, color-mix(in srgb, var(--bg-deep, #1c2f4a) 70%, transparent));
  pointer-events: none;
}
.pano-split-link {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--blue);
  padding: 0;
  margin-bottom: 8px;
}
.pano-split-link:hover { color: var(--accent); text-decoration: underline; }
.pano-split-notes {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.pano-split-notes-h {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pano-split-note {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.4;
  padding: 8px 10px;
  background: var(--bg-elevated);
  border-radius: 4px;
  border: 1px solid var(--border);
  margin-bottom: 6px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.pano-split-note.empty {
  font-style: italic;
  color: var(--text-muted);
  border-style: dashed;
}
.pano-split-note .rm {
  cursor: pointer;
  color: var(--text-muted);
  opacity: 0.55;
  flex-shrink: 0;
  font-size: 10px;
  border: none;
  background: none;
  padding: 0;
}
.pano-split-note .rm:hover { opacity: 1; color: var(--red); }
.pano-split-empty-work {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
}
@media (max-width: 720px) {
  .pano-split-grid { grid-template-columns: 1fr; }
  .pano-split-col + .pano-split-col {
    border-left: none;
    border-top: 1px solid var(--border);
  }
}

/* Processos colapsados — mesma escala de .ec-title / .ec-sub (Pessoas, Bens, Tarefas) */
.process-group { margin-bottom: 0; border-right: 0; border-bottom: 1px solid var(--border); border-left: 0; border-radius: 0; background: transparent; overflow: hidden; }
.process-group:first-child { border-top: 1px solid var(--border); }
.process-group.open { border-color: var(--border-light); }
.process-summary {
  display: grid;
  grid-template-columns: 24px minmax(260px,1.7fr) minmax(100px,.55fr) minmax(140px,.75fr) minmax(140px,.7fr);
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-primary);
  text-align: left;
  font-family: var(--font-display);
}
.process-summary:hover { background: rgba(255,255,255,.025); }
.process-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: 1px solid var(--border-light);
  border-radius: 50%;
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1;
}
.process-id { min-width: 0; }
.process-id strong, .process-id small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.process-id strong { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text-primary); }
.process-id small {
  margin-top: 2px;
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}
.process-stat, .process-risk { min-width: 0; font-family: var(--font-display); }
.process-stat small, .process-risk small {
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.process-stat strong, .process-risk strong {
  display: block;
  margin-top: 2px;
  color: var(--text-secondary);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
}
.process-risk.risk-critical strong { color: var(--red); }
.process-risk.risk-warning strong { color: var(--yellow); }
.process-risk.risk-ok strong { color: var(--green); }
.process-detail { padding: 0 8px 10px; border-top: 1px solid var(--border); background: var(--bg-card); }
.process-detail > .entity-card { margin: 8px 0 0 !important; padding-top: 10px !important; border-top: 1px dashed var(--border) !important; border-color: transparent !important; border-radius: 0 !important; background: transparent !important; }
/* Detalhe dentro do painel Visão D: sem tom elevated (reservado às barras IDPJ/Cautelar/…) */
.proc-md-pane .demo-proc-table-detail td,
.proc-md-pane .process-detail {
  background: var(--bg-card);
}
/* Cabeçalho da tabela: um único tom claro em todas as colunas (sem marcar Processo). */
.proc-md-pane .demo-proc-table thead th {
  background: color-mix(in srgb, var(--bg-main) 55%, var(--bg-card));
}

.cda-row { cursor: pointer; transition: background .12s ease; font-family: var(--font-display); }
.cda-row:hover { background: var(--blue-dim) !important; }
.cda-row.open { background: color-mix(in srgb, var(--accent, #9a6b3a) 6%, transparent); }
.cda-expand-row { cursor: pointer; }
.cda-expand-chev {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; padding: 0; margin-right: 4px; flex-shrink: 0;
  border: none; background: transparent; color: var(--text-muted);
  font-size: 10px; line-height: 1; cursor: pointer; font-family: inherit;
}
.cda-expand-chev:hover { color: var(--accent); }
.cda-link { color: var(--blue); font-size: 11px; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(91,143,217,.45); text-underline-offset: 2px; }
.cda-expand-detail {
  margin: 4px 0 8px 12px;
  padding-left: 10px;
  border-top: 1px dashed var(--border);
  border-left: 2px solid color-mix(in srgb, var(--border) 80%, transparent);
  background: color-mix(in srgb, var(--bg-elevated, var(--bg-card)) 70%, transparent);
}
.cda-expand-detail .cda-inline-detail {
  border: none; background: transparent; margin: 0; border-radius: 0;
}
.cda-inline-detail {
  padding: 10px 12px 12px; margin: 0 0 6px; border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 4px 4px;
  background: color-mix(in srgb, var(--bg-elevated, var(--bg-card)) 88%, transparent);
}
.cda-inline-fields {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px 12px;
}
.cda-inline-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cda-inline-field .im-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
.cda-inline-field strong { font-size: 11px; font-weight: 600; color: var(--text-primary); font-family: var(--font-mono); }
.cda-inline-resp { margin-top: 10px; }
.cda-inline-resp-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cda-inline-actions { display: flex; gap: 6px; margin-top: 10px; }
.demo-proc-table-detail td { padding: 0 8px 10px !important; background: color-mix(in srgb, var(--bg-elevated, var(--bg-card)) 70%, transparent); border-bottom: 1px solid var(--border); }
.demo-proc-table-detail .cda-inline-detail { margin: 0; border: none; border-radius: 0; background: transparent; padding: 8px 4px; }
.cda-status { color: var(--text-muted); font-family: var(--font-display); font-size: 10px; font-weight: 600; }

/* Beta: linha fechada STATUS — situação — data (sem quebrar no meio da frase) */
.cda-closed-line {
  display: block;
  max-width: 100%;
  font-size: 10px;
  line-height: 1.35;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: var(--font-display);
}
.cda-closed-line.overdue { color: var(--red); font-weight: 700; }
.cda-closed-status {
  font-weight: 700;
  color: color-mix(in srgb, var(--blue, #5b8fd9) 55%, var(--text-primary));
  letter-spacing: 0.02em;
}
.cda-closed-line.overdue .cda-closed-status { color: var(--red); }
.cda-closed-sit, .cda-closed-date { font-weight: 500; color: inherit; }

/* Lista de CDAs em largura total do card; três quadros de prazo lado a lado (clássico + Beta) */
.proc-expand-grid.demo-proc-expand .proc-expand-cdas {
  grid-column: 1 / -1;
  min-width: 0;
  margin-top: 4px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.cda-expand-detail {
  margin-left: 0;
  padding-left: 0;
  border-left: none;
}
.cda-inline-detail--beta > .cda-presc-cols {
  margin-top: 0;
  margin-bottom: 12px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (max-width: 980px) {
  .cda-inline-detail--beta > .cda-presc-cols {
    grid-template-columns: 1fr;
  }
}

/* Fonte legível + ocorrências: data numa faixa, fato/efeito no resto (sem sobreposição) */
.cda-presc-sum { font-size: 10px; line-height: 1.4; }
.cda-presc-dates,
.cda-presc-est,
.cda-presc-empty { font-size: 9px; line-height: 1.4; }
.cda-presc-chk { font-size: 9px; line-height: 1.35; }
.cda-presc-occ-list { display: flex; flex-direction: column; gap: 7px; }
.cda-presc-occ-row {
  display: grid;
  /* Date track sizes to dd/mm/aaaa (max-content); body takes the rest — no overlap */
  grid-template-columns: max-content minmax(0, 1fr);
  column-gap: 10px;
  row-gap: 2px;
  align-items: start;
  font-size: 9px;
  line-height: 1.4;
}
.cda-presc-occ-date {
  font-family: var(--font-mono);
  color: var(--text-primary);
  white-space: nowrap;
}
.cda-presc-occ-body { min-width: 0; }
.cda-presc-occ-fact {
  color: var(--text-secondary);
  overflow-wrap: break-word;
  word-break: normal;
}
.cda-presc-occ-effect {
  margin-top: 2px;
  color: var(--text-muted);
  overflow-wrap: break-word;
  word-break: normal;
}
.cda-presc-occ-src {
  display: inline-block;
  margin-left: 6px;
  font-size: 8px;
  color: var(--text-muted);
  font-weight: 600;
}

.process-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-items: center;
  margin-bottom: 6px;
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 11px;
}
.process-meta > * {
  display: inline-flex;
  align-items: center;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 500;
  padding: 0;
}
.process-meta button {
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-elevated, var(--bg-card)) 80%, transparent);
  color: var(--text-secondary);
}
.process-meta button.active {
  color: var(--gold);
  font-weight: 600;
  border-color: color-mix(in srgb, var(--gold) 40%, var(--border));
  background: color-mix(in srgb, var(--gold) 10%, transparent);
}
.process-meta strong { color: var(--text-secondary); font-weight: 600; }
.process-meta .proc-meta-chip {
  padding: 2px 7px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--text-muted) 12%, transparent);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.process-meta .ef-status-badge { margin: 0; }
.process-meta .overdue { color: var(--red); }

.proc-expand-grid {
  display: grid;
  grid-template-columns: minmax(240px, 1.35fr) minmax(220px, 1.2fr) 118px;
  gap: 8px 10px;
  align-items: start;
  width: 100%;
  margin-bottom: 8px;
}
.proc-expand-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.proc-expand-toolbar {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.proc-expand-toolbar input[type="checkbox"] {
  width: 14px;
  height: 14px;
  margin: 4px 0 0;
  flex-shrink: 0;
  cursor: pointer;
}
.proc-expand-toolbar .process-meta { flex: 1; min-width: 0; margin-bottom: 0; }
.proc-expand-facts {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 10px;
  line-height: 1.4;
}
.proc-expand-fact {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 6px 8px;
  align-items: start;
}
.proc-expand-fact .lbl {
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.proc-expand-fact .val {
  color: var(--text-secondary);
  min-width: 0;
  overflow-wrap: break-word;
}
.proc-expand-fact .doc {
  display: inline-block;
  margin-left: 6px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-muted);
}
.proc-expand-fact-dates {
  grid-template-columns: 1fr;
}
.proc-expand-fact-dates > span { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); }
.proc-expand-fact-dates strong { font-weight: 600; color: var(--text-secondary); }

.demo-proc-hub-b-expanded { margin: 0 0 10px 18px; padding-left: 10px; border-left: 2px solid color-mix(in srgb, var(--pgfn, #9b2848) 35%, transparent); }

/* ── Visão D · Master–detail (clássico + demo) ── */
/* Hierarquia de fundos com degraus curtos (menos contraste entre tons). */
/* Altura pelo conteúdo: cresce ao expandir linhas; sem scroll interno no frame. */
.proc-md-frame {
  display: grid; grid-template-columns: 280px 1fr; gap: 0;
  height: auto;
  max-height: none;
  border: 1px solid var(--border); border-radius: 8px;
  overflow: visible; background: var(--bg-card);
  align-items: stretch;
}
.proc-md-rail {
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-main) 40%, var(--bg-card));
  display: flex; flex-direction: column; min-height: 0;
  max-height: none; overflow: visible;
  border-radius: 8px 0 0 8px;
}
.proc-md-pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--bg-card); border-radius: 0 8px 8px 0; overflow: visible;
}
.proc-md-pane-body { padding: 12px 16px 14px; flex: 0 1 auto; min-height: 0; }

/* Separação forte: EFs abrangidas × sem vínculo */
.proc-md-section-split {
  display: flex; align-items: center; gap: 12px;
  margin: 28px 0 14px;
  padding: 0;
}
.proc-md-section-split::before,
.proc-md-section-split::after {
  content: ''; flex: 1; height: 2px;
  background: linear-gradient(90deg, transparent, var(--border-light), var(--border-light));
}
.proc-md-section-split::after {
  background: linear-gradient(90deg, var(--border-light), var(--border-light), transparent);
}
.proc-md-section-split span {
  flex-shrink: 0;
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-secondary);
  padding: 4px 10px;
  border: 1px solid var(--border-light);
  border-radius: 999px;
  background: var(--bg-elevated);
}
.proc-md-rail-h {
  padding: 12px 14px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--pgfn-light, #c45a72); border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg-main) 40%, var(--bg-card));
}
.proc-md-hub {
  display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left;
  padding: 11px 14px; border: none; border-left: 3px solid transparent;
  border-bottom: 1px solid var(--border); border-radius: 0;
  background: transparent; cursor: pointer; font-family: inherit; color: inherit;
  box-sizing: border-box;
}
.proc-md-hub:hover { background: color-mix(in srgb, var(--bg-card) 40%, transparent); }
.proc-md-hub.active {
  background: color-mix(in srgb, var(--bg-card) 70%, var(--bg-main));
  border-left-color: var(--pgfn, #9b2848);
}
.proc-md-hub-tag {
  font-size: 9px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--pgfn, #9b2848);
}
.proc-md-hub-num {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 11px; font-weight: 600; margin-top: 2px; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.proc-md-hub-meta {
  font-size: 10px; color: var(--text-muted); margin-top: 3px;
  display: flex; flex-wrap: wrap; gap: 8px;
  /* Recuo sob o nº do processo — hierarquia visual simétrica */
  padding-left: 10px;
}
.proc-md-hub-meta .risk-critical { color: var(--red); font-weight: 700; }
.proc-md-hub-meta .risk-warning { color: var(--yellow); font-weight: 700; }
.proc-md-hub-meta .risk-ok { color: var(--green); font-weight: 600; }
.proc-md-rail-sec {
  /* Mesmo corpo tipográfico das faixas do rail (Ativa/Suspensa/Não ajuizadas…). */
  padding: 10px 14px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-muted); margin-top: 4px;
  border-left: 3px solid transparent; line-height: 1.35;
}
.proc-md-rail-sec.band {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; cursor: pointer; border: none; background: transparent;
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
  margin-top: 6px; border-radius: 0 6px 6px 0;
  padding: 8px 10px 6px 11px; line-height: 1.35;
}
.proc-md-rail-sec.band:hover { filter: brightness(1.08); }
.proc-md-rail-sec.band .band-tot {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none; opacity: 0.9;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58%;
  color: inherit; line-height: inherit;
}
.proc-md-rail-sec.rail-sem {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
  color: var(--text-secondary);
}
.rail-block-nao-ajuiz {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.proc-md-rail-sec.band-nao-ajuiz {
  color: var(--text-secondary);
  border-left-color: var(--text-secondary);
  background: color-mix(in srgb, var(--text-secondary) 10%, transparent);
}
.proc-md-rail-item.band-nao-ajuiz {
  background: color-mix(in srgb, var(--text-secondary) 6%, transparent);
  color: color-mix(in srgb, var(--text-secondary) 75%, var(--text-primary));
}
.proc-md-rail-item.band-nao-ajuiz.open {
  background: color-mix(in srgb, var(--text-secondary) 12%, transparent);
  box-shadow: inset 3px 0 0 var(--text-secondary);
}
.proc-md-block-label.band-nao-ajuiz {
  color: var(--text-secondary);
  border-left: 3px solid var(--text-secondary);
  padding-left: 8px;
  background: color-mix(in srgb, var(--text-secondary) 8%, transparent);
  border-radius: 0 6px 6px 0;
}
.ef-status-badge.nao_ajuizada {
  background: color-mix(in srgb, var(--text-secondary) 14%, transparent);
  color: var(--text-secondary);
}
.proc-md-rail-sec.band-ativa {
  color: var(--green); border-left-color: var(--green);
  background: color-mix(in srgb, var(--green) 4%, transparent);
}
.proc-md-rail-sec.band-suspensa {
  color: var(--orange, #d88840); border-left-color: var(--orange, #d88840);
  background: color-mix(in srgb, var(--orange, #d88840) 5%, transparent);
}
.proc-md-rail-sec.band-parc {
  color: var(--blue); border-left-color: var(--blue);
  background: color-mix(in srgb, var(--blue) 5%, transparent);
}
.proc-md-rail-sec.band-arq {
  color: var(--yellow); border-left-color: var(--yellow);
  background: color-mix(in srgb, var(--yellow) 5%, transparent);
}
.proc-md-rail-sec.band-extinta {
  color: var(--text-muted); border-left-color: var(--text-muted);
  background: color-mix(in srgb, var(--text-muted) 4%, transparent);
}
.proc-md-rail-sec.band.selected { box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 35%, transparent); }
.proc-md-rail-item.band-ativa {
  color: color-mix(in srgb, var(--green) 55%, var(--text-primary));
}
.proc-md-rail-item.band-suspensa {
  background: color-mix(in srgb, var(--orange, #d88840) 4%, transparent);
  color: color-mix(in srgb, var(--orange, #d88840) 70%, var(--text-primary));
}
.proc-md-rail-item.band-parc {
  background: color-mix(in srgb, var(--blue) 4%, transparent); color: color-mix(in srgb, var(--blue) 70%, var(--text-primary));
}
.proc-md-rail-item.band-arq {
  background: color-mix(in srgb, var(--yellow) 4%, transparent); color: color-mix(in srgb, var(--yellow) 65%, var(--text-primary));
}
.proc-md-rail-item.band-extinta {
  background: color-mix(in srgb, var(--text-muted) 3%, transparent);
  color: color-mix(in srgb, var(--text-muted) 70%, var(--text-primary));
}
.proc-md-rail-item.band-ativa.open {
  background: color-mix(in srgb, var(--green) 6%, transparent);
  box-shadow: inset 3px 0 0 var(--green);
}
.proc-md-rail-item.band-parc.open {
  background: color-mix(in srgb, var(--blue) 6%, transparent);
  box-shadow: inset 3px 0 0 var(--blue);
}
.proc-md-rail-item.band-arq.open {
  background: color-mix(in srgb, var(--yellow) 14%, transparent);
  box-shadow: inset 3px 0 0 var(--yellow);
}
.proc-md-rail-item.band-suspensa.open {
  background: color-mix(in srgb, var(--orange, #d88840) 14%, transparent);
  box-shadow: inset 3px 0 0 var(--orange, #d88840);
}
.proc-md-rail-item.band-extinta.open {
  background: color-mix(in srgb, var(--text-muted) 14%, transparent);
  box-shadow: inset 3px 0 0 var(--text-muted);
}
.proc-md-rail-item.open {
  background: color-mix(in srgb, var(--accent, #9a6b3a) 10%, transparent);
  box-shadow: inset 3px 0 0 var(--accent, #9a6b3a);
}
.proc-md-block-label.band-ativa { color: var(--green); border-left: 3px solid var(--green); padding-left: 8px; }
.proc-md-block-label.band-suspensa {
  color: var(--orange, #d88840); border-left: 3px solid var(--orange, #d88840); padding-left: 8px;
  background: color-mix(in srgb, var(--orange, #d88840) 8%, transparent); border-radius: 0 6px 6px 0;
}
.proc-md-block-label.band-parc {
  color: var(--blue); border-left: 3px solid var(--blue); padding-left: 8px;
  background: color-mix(in srgb, var(--blue) 8%, transparent); border-radius: 0 6px 6px 0;
}
.proc-md-block-label.band-arq {
  color: var(--yellow); border-left: 3px solid var(--yellow); padding-left: 8px;
  background: color-mix(in srgb, var(--yellow) 8%, transparent); border-radius: 0 6px 6px 0;
}
.proc-md-block-label.band-extinta {
  color: var(--text-muted); border-left: 3px solid var(--text-muted); padding-left: 8px;
  background: color-mix(in srgb, var(--text-muted) 8%, transparent); border-radius: 0 6px 6px 0;
}
.proc-md-block-label.band-anchor {
  color: var(--pgfn, #9b2848); border-left: 3px solid var(--pgfn, #9b2848); padding-left: 8px;
}
.proc-md-block-label.band-sem {
  color: var(--text-secondary); border-left: 3px solid var(--border-light); padding-left: 8px;
}
.proc-rel-chips {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px;
}
.proc-rel-chip {
  display: inline-flex; align-items: center; gap: 5px;
  max-width: 100%; padding: 2px 8px; border-radius: 4px;
  border: 1px solid color-mix(in srgb, var(--blue) 35%, var(--border));
  background: color-mix(in srgb, var(--blue) 8%, transparent);
  color: var(--text-secondary); cursor: pointer; font-family: inherit;
  font-size: 9px; line-height: 1.35;
}
.proc-rel-chip:hover {
  color: var(--text-primary); border-color: var(--blue);
  background: color-mix(in srgb, var(--blue) 14%, transparent);
}
.proc-rel-chip .mono {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em;
}
.proc-rel-chip .nat {
  font-size: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--blue); flex-shrink: 0;
}
.proc-rel-chip-sigla { padding: 1px 5px; gap: 0; }
.proc-rel-chips-full .proc-rel-chip .mono {
  max-width: none; overflow: visible; text-overflow: unset;
}
.proc-row-rel-full { padding: 10px 12px 0; }
.proc-row-rel-full .proc-rel-chips { margin-top: 0; }
.proc-hub-rel { margin-top: 10px; }
.proc-hub-rel .proc-rel-chips { margin-top: 0; }
.proc-section-card {
  margin-top: 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); overflow: hidden;
  box-shadow: var(--shadow);
}
.proc-section-card:first-of-type { margin-top: 0; }
.proc-dup-banner + .proc-section-card { margin-top: 14px; }
.proc-section-card-h {
  width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border: none; background: var(--bg-elevated);
  cursor: pointer; font-family: inherit; text-align: left; color: inherit;
  font-size: 12px; font-weight: 700;
  border-bottom: 1px solid transparent;
}
.proc-section-card.open .proc-section-card-h { border-bottom-color: var(--border); }
.proc-section-card-h .count {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-weight: 600; color: var(--text-muted); margin-left: 4px;
}
.proc-section-card-h .muted { font-size: 10px; font-weight: 500; color: var(--text-muted); }
.proc-section-card-body {
  padding: 10px 12px 12px;
  height: auto;
  background: var(--bg-main);
}
.proc-section-card-body .proc-md-frame {
  margin: 0;
  min-height: 0;
  height: auto;
  max-height: none;
}
.proc-others-card {
  margin-top: 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); overflow: hidden;
}
.proc-others-card-h {
  width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border: none; background: var(--bg-elevated);
  cursor: pointer; font-family: inherit; text-align: left; color: inherit;
  font-size: 12px; font-weight: 700;
  border-bottom: 1px solid transparent;
}
.proc-others-card.open .proc-others-card-h { border-bottom-color: var(--border); }
.proc-others-card-h .count {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-weight: 600; color: var(--text-muted); margin-left: 4px;
}
.proc-others-card-h .muted { font-size: 10px; font-weight: 500; color: var(--text-muted); }
.proc-others-card-body { padding: 12px 16px 16px; background: var(--bg-main); }
.proc-cda-count {
  margin-top: 12px;
  padding-top: 8px;
  color: var(--text-muted);
  font-size: 11px;
}
.proc-jump-flash {
  animation: procJumpFlash 1.2s ease;
}
@keyframes procJumpFlash {
  0%, 100% { background-color: transparent; }
  20%, 55% { background-color: color-mix(in srgb, var(--blue) 18%, transparent); }
}
.ef-status-badge {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.03em;
  padding: 2px 7px; border-radius: 4px; text-transform: uppercase;
}
.ef-status-badge.ativa { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.ef-status-badge.suspensa {
  background: color-mix(in srgb, var(--orange, #d88840) 14%, transparent); color: var(--orange, #d88840);
}
.ef-status-badge.suspensa_parcelamento {
  background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue);
  border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent);
}
.ef-status-badge.arquivada {
  background: color-mix(in srgb, var(--yellow) 14%, transparent); color: var(--yellow);
  border: 1px solid color-mix(in srgb, var(--yellow) 40%, transparent);
}
.ef-status-badge.extinta { background: color-mix(in srgb, var(--text-muted) 18%, transparent); color: var(--text-muted); }

/* Operações · lista de cards (alfabética + filtro) */
.ops-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 14px;
}
.ops-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  align-items: stretch;
}
.ops-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
}
.ops-card:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.ops-card.is-encerrada { opacity: 0.62; }
.ops-card .kc-name { font-weight: 700; font-size: 13px; color: var(--text-primary); line-height: 1.3; }
.ops-card .kc-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ops-card .kc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ops-card .kc-tag {
  font-size: 8px; font-weight: 600; letter-spacing: 0.2px;
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  background: rgba(255,255,255,0.04);
}
.ops-card .kc-stats { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; color: var(--text-muted); }
.ops-card .kc-alerts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto; }
.ops-card .kc-obs { font-size: 9px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.proc-md-rail-item {
  /* Itens do rail (EF / CDA): mesmo tamanho que as faixas acima. */
  padding: 7px 14px; font-size: 10px; color: var(--text-secondary); cursor: pointer;
  border: none; background: transparent; width: 100%; text-align: left; font-family: inherit;
  line-height: 1.35;
}
.proc-md-rail-item:hover { color: var(--text-primary); background: color-mix(in srgb, var(--bg-card) 45%, transparent); }
.proc-md-rail-item .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); font-size: 10px; }
.proc-md-rail-item .muted { color: var(--text-muted); font-size: 10px; }
.proc-md-rail-item .apenso-count { font-size: 10px; }
.proc-md-rail-item.demoted { opacity: 0.65; }
.proc-md-rail-item.nested { padding-left: 22px; font-size: 10px; }
.proc-md-pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--bg-card); border-radius: 0 8px 8px 0; overflow: auto;
}
.proc-md-pane-h {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  flex-shrink: 0;
  background: var(--bg-card);
}
.proc-md-pane-h h2 { font-size: 14px; font-weight: 700; margin: 0; color: var(--text-primary); line-height: 1.3; }
.proc-md-pane-num {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 12px; color: var(--text-secondary); margin-top: 3px;
}
.proc-md-pane-actions { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
.proc-md-quiet-btn {
  font-weight: 500 !important;
  color: var(--text-secondary) !important;
  background: transparent !important;
  border: 1px solid var(--border) !important;
  padding: 2px 7px !important;
  font-size: 10px !important;
}
.proc-md-quiet-btn:hover {
  color: var(--text-primary) !important;
  border-color: var(--border-light) !important;
  background: var(--bg-elevated) !important;
}
.proc-md-pane-body { padding: 12px 16px 14px; flex: 0 1 auto; min-height: 0; }
/* Hub pane: meta/notas no padrão das intimações — sem card interno; só linhas. */
.proc-md-hub-meta-block { margin-bottom: 12px; }
.proc-md-hub-stats {
  display: flex; flex-wrap: wrap; align-items: stretch; gap: 0;
  padding: 0 0 10px; margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.proc-md-hub-stat {
  flex: 1 1 0; min-width: 110px;
  display: flex; flex-direction: column; gap: 2px;
  padding: 0 14px; border-right: 1px solid var(--border);
}
.proc-md-hub-stat:first-child { padding-left: 0; }
.proc-md-hub-stat:last-child { border-right: none; padding-right: 0; }
.proc-md-hub-stat .im-label {
  font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
}
.proc-md-hub-stat strong { font-size: 11px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
.proc-md-hub-stat .risk-critical { color: var(--red); }
.proc-md-hub-stat .risk-warning { color: var(--yellow); }
.proc-md-hub-stat .risk-ok { color: var(--green); }
.proc-md-hub-notes-flat { min-height: 0; }
.proc-md-hub-notes-h {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 6px;
}
.proc-md-hub-notes-h .intim-center-label { margin: 0; }
.proc-md-own-block {
  margin-top: 12px;
  border: 1px solid color-mix(in srgb, var(--purple, #7a8ba3) 28%, var(--border));
  border-radius: 6px;
  overflow: hidden;
}
.proc-md-own-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 8px 12px;
  background: color-mix(in srgb, var(--purple, #7a8ba3) 8%, var(--bg-card));
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
}
.proc-md-own-h span:last-child {
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 12px;
  font-weight: 600;
}
.proc-md-own-block .demo-proc-table-wrap { margin: 0; border: none; border-radius: 0; }
.pano-split-ef.pano-split-self {
  background: color-mix(in srgb, var(--purple, #7a8ba3) 8%, var(--bg-card));
  border: 1px solid color-mix(in srgb, var(--purple, #7a8ba3) 22%, var(--border));
  border-radius: 5px;
  padding: 6px 8px;
  margin-bottom: 4px;
}
.especie-badge {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: 4px; text-transform: uppercase;
  background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue);
  border: 1px solid color-mix(in srgb, var(--blue) 28%, transparent);
}
.apenso-badge {
  display: inline-block; margin-left: 6px; vertical-align: middle;
  font-size: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px;
  background: color-mix(in srgb, var(--accent, #9a6b3a) 14%, transparent);
  color: var(--accent, #9a6b3a);
  border: 1px solid color-mix(in srgb, var(--accent, #9a6b3a) 35%, transparent);
  white-space: nowrap;
}
.apenso-count {
  display: inline-block; margin-left: 6px;
  font-size: 9px; font-weight: 600; color: var(--text-muted);
  letter-spacing: 0; text-transform: none;
}
.proc-apenso-cell { padding-left: 10px; }
.proc-apenso-mark {
  color: var(--text-muted); margin-right: 4px; font-weight: 700;
}
.demo-proc-table-row.is-apenso td { opacity: 0.95; }
.proc-md-rail-item.nested { padding-left: 22px; font-size: 10px; }
.proc-apenso-parent-ref { font-size: 10px; color: var(--text-muted); margin-left: 4px; font-weight: normal; }

/* ── Processo Relevante (★ e destaque de linha mesmo recolhida) ── */
.relevant-star {
  display: inline-block;
  color: var(--gold, #c8a04a);
  font-size: 11px;
  margin-left: 4px;
  vertical-align: middle;
  cursor: help;
  line-height: 1;
}
.demo-proc-table-row.is-relevant td {
  background: color-mix(in srgb, var(--gold, #c8a04a) 10%, transparent);
}
.demo-proc-table-row.is-relevant:hover td {
  background: color-mix(in srgb, var(--gold, #c8a04a) 16%, transparent);
}
.proc-md-rail-item.is-relevant {
  background: color-mix(in srgb, var(--gold, #c8a04a) 10%, transparent);
  border-left: 3px solid var(--gold, #c8a04a);
}
.proc-md-rail-item.is-relevant:hover {
  background: color-mix(in srgb, var(--gold, #c8a04a) 16%, transparent);
}
.process-summary.is-relevant {
  border-left: 3px solid var(--gold, #c8a04a);
  background: color-mix(in srgb, var(--gold, #c8a04a) 6%, transparent);
}
.demo-proc-ef-chip.is-relevant {
  border-color: color-mix(in srgb, var(--gold, #c8a04a) 60%, var(--border));
  background: color-mix(in srgb, var(--gold, #c8a04a) 10%, var(--bg-elevated));
}
.proc-md-hub.is-relevant {
  border-left: 3px solid var(--gold, #c8a04a);
  background: color-mix(in srgb, var(--gold, #c8a04a) 10%, transparent);
}
.pano-split-ef.is-relevant {
  border-left-color: var(--gold, #c8a04a);
  background: color-mix(in srgb, var(--gold, #c8a04a) 8%, var(--bg-elevated));
}
.proc-dup-banner {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px;
  margin: 0 0 10px; padding: 8px 12px; border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--red) 35%, var(--border));
  background: color-mix(in srgb, var(--red) 8%, var(--bg-card));
  font-size: 11px; color: var(--text-secondary);
}
.proc-dup-banner strong { color: var(--red); font-size: 11px; }
.proc-related-cell .proc-related-ref { font-size: 10px; color: var(--text-secondary); }
.proc-related-cell .muted { color: var(--text-muted); font-size: 11px; }
.proc-md-block-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-muted); margin: 14px 0 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}

/* ── Modelos · Opção A (lista + ficha) ── */
.model-md-frame {

}

}

}

}

}

.model-badge-ok { color: var(--green); border-color: var(--green); background: var(--green-dim); }
.model-badge-wait { color: var(--blue); border-color: var(--blue); background: var(--blue-dim); }
.model-badge-pri { color: var(--text-muted); border-color: var(--border-light); }

.model-md-tab {

}

.model-pcard { display: grid; grid-template-columns: 88px 1fr auto; gap: 8px; align-items: start; }
.model-p-kind { font-size: 8px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; width: fit-content; }
.model-k-vinc { background: var(--green-dim); color: var(--green); }
.model-k-qual { background: var(--blue-dim); color: var(--blue); }

.model-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 12px; }
.model-chip {
  font-family: inherit; font-size: 10px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer;
}

.model-md-actions { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .model-md-frame { grid-template-columns: 1fr; }
  .model-md-rail { max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }

  }

    border-bottom: 1px solid var(--border);
  }

.edition-demo .presc-ruler-note { font-size: 10px; color: var(--orange); margin-top: 2px; }

.app-layout.edition-claude {
